<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bozze dei quiz Moodle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Banco di lavoro a due viste (scaletta, dettaglio). Intestazione fissa con quiz e schede; contenuto a tutta larghezza.
   Il foglio dello studente è l'unico elemento "carta" (bianco, bordo e fascia verde-petrolio); le note del docente stanno in un riquadro ambra. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --surface-2:#E9EFED; --line:#D3DCD9; --line-strong:#AEBDB9;
  --fg:#16211E; --fg-2:#41524D; --fg-3:#5F706C;
  --accent:#0C6A62; --accent-fg:#FFFFFF; --accent-soft:#D9EDE9; --accent-line:#8FC7BF;
  --teacher:#FFF4D6; --teacher-line:#E3C873; --teacher-fg:#4A3A06;
  --ok:#1E7A3C; --ok-soft:#DDF1E3; --warn:#8F5200; --warn-soft:#FFEFCF; --err:#B3261E; --err-soft:#FCE4E1; --info:#1D5CA3; --info-soft:#E1ECF8;
  --code-bg:#EDF2F0; --focus:#0C6A62;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#18221F; --surface-2:#202D29; --line:#2F403B; --line-strong:#4A625C;
    --fg:#E7EFEC; --fg-2:#B5C5C0; --fg-3:#8FA49E;
    --accent:#4DC2B2; --accent-fg:#04201B; --accent-soft:#143A35; --accent-line:#2E7A70;
    --teacher:#352C10; --teacher-line:#7A6422; --teacher-fg:#F1DFA6;
    --ok:#5CC283; --ok-soft:#173A25; --warn:#F0B35A; --warn-soft:#3C2B0E; --err:#FF8D84; --err-soft:#4A1C19; --info:#8DBBF0; --info-soft:#142E4A;
    --code-bg:#111B18; --focus:#4DC2B2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#18221F; --surface-2:#202D29; --line:#2F403B; --line-strong:#4A625C;
  --fg:#E7EFEC; --fg-2:#B5C5C0; --fg-3:#8FA49E;
  --accent:#4DC2B2; --accent-fg:#04201B; --accent-soft:#143A35; --accent-line:#2E7A70;
  --teacher:#352C10; --teacher-line:#7A6422; --teacher-fg:#F1DFA6;
  --ok:#5CC283; --ok-soft:#173A25; --warn:#F0B35A; --warn-soft:#3C2B0E; --err:#FF8D84; --err-soft:#4A1C19; --info:#8DBBF0; --info-soft:#142E4A;
  --code-bg:#111B18; --focus:#4DC2B2;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
h1,h2,h3,h4,h5{margin:0;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--fg-3)}

/* intestazione */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px 0}
.top-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;max-width:1400px;margin-inline:auto}
.brand{font-size:15px;font-weight:700;letter-spacing:.01em;padding-bottom:9px}
.qsel{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;min-width:0}
.qsel span{font-size:11px;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{border:0;background:none;padding:9px 16px;border-bottom:3px solid transparent;font-weight:600;color:var(--fg-2)}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.wrap{max-width:1400px;margin-inline:auto;padding-block:18px 56px}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

/* campi */
.ctl{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12px;color:var(--fg-3)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;align-items:end}
.meta .wide{grid-column:span 2}
.meta>*{min-width:0}.meta .ctl{width:100%}
.cat{padding:6px 0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.sm{padding:3px 9px;font-size:12.5px}

/* tag di stato (testo + icona, mai solo colore) */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.tag .ic{width:13px;height:13px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.err{background:var(--err-soft);color:var(--err)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.plain{background:var(--surface-2);color:var(--fg-2)}

/* riquadri numerici */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi dt{color:var(--fg-3);font-size:12.5px}
.kpi dd{margin:0}
.kpi .v{font-size:28px;font-weight:600;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:500;color:var(--fg-3)}
.kpi .s{font-size:12.5px;color:var(--fg-2)}
.kpi .tag{align-self:flex-start;margin-top:4px}

/* pannelli comprimibili */
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:600;list-style:none;flex-wrap:wrap}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .chev{transition:transform .15s;margin-left:auto}
details.panel[open]>summary .chev{transform:rotate(180deg)}
.panel-body{padding:0 14px 14px;overflow-x:auto}
.alist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.al{display:flex;gap:10px;align-items:flex-start}
.al .go{margin-left:auto;flex:none}
.al p{margin:0;max-width:90ch}
.alist-ok{margin:0;color:var(--fg-2)}
textarea.note{width:100%;min-height:9em;resize:vertical;line-height:1.55}

/* riepilogo per parte */
.dist{width:100%;border-collapse:collapse}
.dist th{font-size:12px;font-weight:600;color:var(--fg-3);text-align:left;padding:4px 8px 6px}
.dist td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
.dist td:first-child{width:28%;min-width:150px}
.mt{display:grid;grid-template-columns:minmax(80px,1fr) auto;gap:6px 12px;align-items:center}
.meter{position:relative;height:10px;background:var(--accent-soft);border-radius:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.meter.off i{background:var(--warn)}
.meter .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);transform:translateX(-1px)}
.meter .band{position:absolute;top:-3px;bottom:-3px;border:2px solid var(--fg);border-top:0;border-bottom:0;opacity:.7}
.mv{font-variant-numeric:tabular-nums;white-space:nowrap}
.mv .off{color:var(--warn);font-weight:600;display:inline-flex;align-items:center;gap:3px;margin-left:6px}
.legend{margin:8px 8px 0;font-size:12.5px;color:var(--fg-3)}

/* tabella della scaletta */
.tbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tbar h2{font-size:16px}
.tbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tw{position:relative;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table.sc{border-collapse:collapse;width:100%;min-width:1080px}
.sc th{font-size:12px;font-weight:600;color:var(--fg-3);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.sc td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.sc tr:last-child td{border-bottom:0}
.sc tr.sec td{background:var(--surface-2);padding:6px 8px;vertical-align:middle}
.secin{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.sec-name{font-weight:700;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 6px;min-width:12em}
.sec-name:hover{border-color:var(--line-strong)}
.sec-name:focus{border-color:var(--accent);background:var(--surface)}
.secin .sum{color:var(--fg-3);font-size:12.5px}
.secin .btn{margin-left:auto}
.cell.tagc{margin-top:3px;font:11px/1.4 'JetBrains Mono',monospace;color:var(--fg-2);border-color:var(--line)}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px;min-width:0}
.cell:hover{border-color:var(--line-strong)}
.cell:focus{border-color:var(--accent);background:var(--surface)}
select.cell{border-color:var(--line)}
select.cell.bad{border-color:var(--warn);color:var(--warn)}
textarea.cell{resize:vertical;min-height:3.4em;font-size:13px;color:var(--fg-2);line-height:1.45;margin-top:2px}
td.n .cell{text-align:right;font-variant-numeric:tabular-nums}
.real{display:block;font-size:12px;color:var(--fg-3);padding:2px 6px}
.sub{display:block;margin-top:4px}
.sub span{display:block;font-size:11.5px;color:var(--fg-3);padding:0 6px}
.acts{white-space:nowrap}
.ib{border:1px solid transparent;background:none;border-radius:5px;padding:5px;color:var(--fg-2);display:inline-flex;align-items:center}
.ib:hover{border-color:var(--line-strong);color:var(--accent)}
.ib.danger:hover{color:var(--err);border-color:var(--err)}
.ib.confirm{background:var(--err);color:#fff;border-color:var(--err);font-size:12px;font-weight:600;padding:5px 8px}
.flash td{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash td{animation:none;background:var(--accent-soft)}}

/* dettaglio */
.dt{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
/* elenco delle domande: resta fermo mentre la domanda scorre e occupa tutta l'altezza visibile; ha una sua barra solo se è più lungo */
.dlist{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto;position:sticky;top:calc(var(--toph,56px) + 12px);max-height:calc(100vh - var(--toph,56px) - 24px)}
.dsec{padding:8px 12px 4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);background:var(--surface-2);position:sticky;top:0}
.ditem{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;padding:7px 12px 7px 9px}
.ditem:hover{background:var(--surface-2)}
.ditem[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.dpos{font-family:var(--mono);font-size:12px;color:var(--fg-3)}
.dtit{overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--fg-3);display:inline-block}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.dhead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dnav{display:flex;align-items:center;gap:6px;color:var(--fg-2)}
.dname{font-size:20px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface-2);color:var(--fg-2);padding:2px 10px;border-radius:99px}
.chip b{color:var(--fg);font-weight:600}
.nota{margin:8px 0 0;font-size:13px;color:var(--info);display:flex;gap:8px;align-items:flex-start}
.banner{margin:12px 0 0;background:var(--info-soft);color:var(--info);border-radius:6px;padding:8px 12px;display:flex;gap:8px;align-items:flex-start;font-size:13px}
.lb{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:20px 0 6px}
.lb.stu{color:var(--accent)}
.lb.doc{color:var(--teacher-fg);background:var(--teacher);border:1px solid var(--teacher-line);border-bottom:0;border-radius:8px 8px 0 0;margin:20px 0 0;padding:7px 14px}
.lb small{font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px}
.sheet{display:grid;grid-template-columns:130px minmax(0,1fr);background:var(--surface);border:2px solid var(--accent);border-radius:8px;overflow:hidden}
.sheet.page{grid-template-columns:minmax(0,1fr)}
.sheet-info{background:var(--accent-soft);border-right:1px solid var(--accent-line);padding:12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.sheet-info b{font-size:15px}
.sheet-body{padding:16px 20px}
.teacher{background:var(--teacher);border:1px solid var(--teacher-line);border-radius:0 0 8px 8px;padding:14px 20px;color:var(--teacher-fg)}
.teacher code,.teacher pre.code{background:color-mix(in srgb,var(--teacher-fg) 9%,transparent);border-color:var(--teacher-line)}
.teacher th,.teacher td{border-color:var(--teacher-line)}
.empty-card{border:2px dashed var(--line-strong);border-radius:8px;padding:18px 20px;color:var(--fg-2);background:var(--surface)}
.empty-card p{margin:0 0 .5em}
.edit-grid{display:grid;gap:14px;margin-top:16px}
.edit-grid textarea{width:100%;min-height:15em;font-family:var(--mono);font-size:13px;line-height:1.55;resize:vertical}
.hint{font-size:12.5px;color:var(--fg-3);margin:0}

/* testo in Markdown semplificato */
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .85em;max-width:75ch}
.md h3,.md h4,.md h5{margin:1em 0 .4em;font-size:15px}
.md ul,.md ol{margin:0 0 .85em;padding-left:1.4em;max-width:75ch}
.md li{margin-bottom:.35em}
.md ul.opts{list-style:none;padding-left:0}
.md .box{--c:#6d9eeb;background:color-mix(in srgb,var(--c) 16%,var(--surface));border-left:5px solid var(--c);border-radius:4px;padding:10px 14px;margin:0 0 1em;max-width:75ch}
.md .box .bt{font-weight:700;margin:0 0 6px;color:color-mix(in srgb,var(--c) 55%,var(--fg))}
.md .box>:last-child{margin-bottom:0}
.md .b-giallo{--c:#e0b11c}.md .b-verde{--c:#7fb267}.md .b-arancio{--c:#e69138}.md .b-rosso{--c:#e06666}.md .b-ignoto{--c:var(--err)}
.slot.menu{min-width:3.4em}
.slot.old{border-style:dashed;color:var(--warn)}
.teacher .th{margin:14px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.teacher .th:first-child{margin-top:0}
.teacher .th small{font-weight:400;text-transform:none;letter-spacing:0}
.teacher .kh{margin:0 0 4px}
.teacher ol.kc{padding-left:1.6em}
.teacher ol.kc>li{margin-bottom:8px}
.teacher .kt{font-size:12.5px;opacity:.85}
.teacher ul.kl{list-style:none;padding-left:0;margin:2px 0 6px}
.teacher li.k{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;margin-bottom:4px}
.teacher .km{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding-top:2px;opacity:.7}
.teacher li.k.ok .km{opacity:1;color:var(--ok)}
.teacher li.k.neg .km{opacity:1;color:var(--err)}
.teacher .kfb{display:block;font-size:13px;opacity:.85}
.hint.conv summary{cursor:pointer}
textarea.ctl.mono{font:12.5px/1.5 var(--mono)}
.md .crbox{border-top:1px dashed var(--line-strong);margin-top:12px;padding-top:10px}
.md .crl{margin:0 0 6px;font-size:13px;color:var(--fg-2)}
.md .gap{display:inline-block;height:1.25em;vertical-align:-0.25em;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:3px;background:var(--surface)}
.teacher .tbl table{font-size:12.5px}
.hint.conv ul{margin:6px 0 0;padding-left:1.2em}
.md li.opt{display:flex;gap:10px;align-items:flex-start}
.md .rb,.md .cb{flex:none;width:16px;height:16px;margin-top:3px;border:2px solid var(--fg-3)}
.md .rb{border-radius:50%}.md .cb{border-radius:3px}
.md code{font:12.5px var(--mono);background:var(--code-bg);padding:1px 5px;border-radius:4px}
.md .prev2{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin:0 0 1em;max-width:75ch}
.md .prev2>pre.code{flex:1 1 260px;margin:0;min-width:0}
.md .anteprima{flex:1 1 200px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:#111;padding:8px 14px;min-width:0}
.md .anteprima .anlab{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#5F706C;margin-bottom:4px}
.md .anbody th,.md .anbody td{border:1px solid #888;background:none;color:#111}
.md .anbody>*:last-child{margin-bottom:0}
.md pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:10px 14px;overflow-x:auto;margin:0 0 1em;font:13px/1.6 var(--mono)}
.md pre.code code{background:none;padding:0;font:inherit}
.md .tbl{overflow-x:auto;margin:0 0 1em}
.md table{border-collapse:collapse}
.md th,.md td{border:1px solid var(--line-strong);padding:5px 12px;text-align:left}
.md th{background:color-mix(in srgb,var(--fg) 6%,transparent)}

.empty{padding:40px 8px;text-align:center;color:var(--fg-2)}
.empty h2{font-size:18px;margin-bottom:6px;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;max-width:90vw;z-index:50}
.toast.err{background:var(--err);color:#fff}

@media (max-width:860px){
  .dt{grid-template-columns:minmax(0,1fr)}
  .dlist{position:static;max-height:240px}
  .meta .wide{grid-column:auto}
  .tabs{margin-left:0}
}
@media (max-width:560px){
  .sheet{grid-template-columns:minmax(0,1fr)}
  .sheet-info{border-right:0;border-bottom:1px solid var(--accent-line);flex-direction:row;flex-wrap:wrap;gap:3px 14px}
  .sheet-body{padding:14px}
}
.hint{font-size:12px;color:var(--fg-2);margin-top:6px;max-width:34ch;line-height:1.35}
.pill{display:inline-block;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:600;white-space:nowrap}
.dsum{padding:8px 12px;font-size:12.5px;color:var(--fg-2);display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.warnt{color:var(--warn)}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;padding:0;cursor:pointer}
.stline{margin:8px 0 0;font-size:13px;color:var(--fg-2)}
.stline select{margin-left:6px;width:auto;display:inline-block}
.stsel.riv,select.cell.riv{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:600}
.rivbox{margin:12px 0 0;background:var(--warn-soft);color:var(--fg);border-left:5px solid var(--warn);border-radius:6px;padding:10px 14px}

    if(I.tests.some(function(t){return !/^\s*(--|\[\[struttura)/.test(t.code);}))add("info",w+": ogni test inizia con un commento «-- …» che descrive che cosa si guarda (o con [[struttura Tabella]]).",r.id);

function controlliRiga(q,r,add){

    if(gr.length)add("warn",w+": in una Cloze le scelte si scrivono come campo MULTICHOICE_S, non con ( ) o [ ].",r.id);

    else if(cs.length&&Math.abs(peso-num(r.punti))>0.001)add("info",w+": i campi pesano "+f1(peso)+" e la riga vale "+f1(num(r.punti))+" punti: nel quiz contano i punti della riga, il peso dei campi si riproporziona.",r.id);

    if(!gr.length)add("warn",w+": mancano le opzioni, una per riga con ( ) o [ ] e (x) / [x] sulle giuste.",r.id);
    else if(gr.length>1)add("warn",w+": ci sono "+gr.length+" gruppi di opzioni separati: ne serve uno solo.",r.id);
    else if(!gr[0].some(function(x){return x.fr>0;}))add("err",w+": nessuna opzione è segnata come giusta con (x) o [x].",r.id);
    if(gr.length&&real==="Risposta multipla"&&gr[0].some(function(x){return x.fr<100&&x.fr>0;})&&!gr[0].some(function(x){return x.multi;}))add("warn",w+": percentuali parziali con ( ): per più risposte giuste usa [ ].",r.id);
    if(gr.length&&real==="Vero/falso"&&!(gr[0].some(function(x){return /^vero/i.test(x.testo);})&&gr[0].some(function(x){return /^falso/i.test(x.testo);})))add("warn",w+": vero/falso: servono le due opzioni «Vero» e «Falso».",r.id);
    if(gr.length&&gr[0].some(function(x){return x.fr<=0&&!x.fb;}))add("info",w+": alcune opzioni sbagliate non hanno il feedback (riga «> …» sotto l'opzione).",r.id);
    if(gr.length&&real==="Risposta multipla"&&gr[0].some(function(x){return x.multi;})){

  }else if(real==="Descrizione"){
    if(gr.length||cs.length)add("warn",w+": una pagina di spiegazione non può avere campi né opzioni.",r.id);
  }
}

function prefisso(q,r){const c=CAT[r.tipologia];if(!c)return "";if(r.tipologia==="paginablocco"&&(q.tipoQuiz==="RT"||q.tipoQuiz==="ER"))return "Ripasso";return c.pre;}

function nomeMoodle(q,r){const pre=prefisso(q,r);return prefLezione(q)+" - "+(r.pos||"??")+" - "+(pre?pre+": ":"")+(r.titolo||"(senza titolo)");}
/* verifiche ripetibili: righe con lo stesso tag = varianti di una posizione casuale; nei totali conta la prima */

function unita(rows){
  const out=[],per={};
  rows.forEach(function(r){const t=tagDi(r).toLowerCase();if(!t){out.push({rows:[r],tag:"",id:r.id});return;}
    if(per[t]){per[t].rows.push(r);return;}per[t]={rows:[r],tag:tagDi(r),id:r.id};out.push(per[t]);});
  out.forEach(function(u){u.rows.sort(function(a,b){return lettera(a).localeCompare(lettera(b))||num(a.ordine)-num(b.ordine);});u.r=u.rows[0];u.var=u.tag&&true;});
  return out;
}
function unitaDi(rows,id){return unita(rows).find(function(u){return u.rows.some(function(r){return r.id===id;});});}
function lettera(r){const m=String(r.pos||"").match(/[a-z]$/);return m?m[0]:"";}

function slug(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").split("-").slice(0,3).join("-");}

function calc(q,rows){
  const P=TIPI[q.tipoQuiz]||TIPI.ED;
  const tot={p:0,m:0,n:0,pag:0,man:0,manP:0};const gr={};

    if(new Set(g.map(function(r){return num(r.minuti);})).size>1)add("info","Le varianti del tag «"+t+"» ("+nomi+") hanno minuti diversi: nei totali conta la prima.",g[0].id);
    const ix=g.map(function(r){return rows.indexOf(r);});if(ix[ix.length-1]-ix[0]+1!==g.length)add("warn","Le varianti del tag «"+t+"» ("+nomi+") non sono consecutive nella scaletta.",g[0].id);

    g.forEach(function(r){const c=CAT[r.tipologia];if(c&&c.pagina)add("err",(r.pos||"")+": una pagina non può avere un tag (le pagine restano fisse).",r.id);});
  });
  if(Object.keys(GT).length)add("info","Verifica ripetibile: "+Object.keys(GT).length+" posizioni casuali per tag con "+Object.keys(GT).reduce(function(a,k){return a+GT[k].length;},0)+" varianti. Nei totali ogni posizione conta una volta.");
  if(P.cinque){const no5=rows.filter(function(r){const p=num(r.punti);return p>0&&Math.abs(p/5-Math.round(p/5))>1e-9;});if(no5.length)add("warn","Punti non multipli di 5 in "+no5.map(function(r){return r.pos;}).join(", ")+": nella spiegazione solo teoria i punti vanno a multipli di 5.",no5[0].id);}
  if(P.p100&&Math.abs(tot.p-100)>0.001)add(tot.p>100?"err":"warn","Il totale dei punti è "+f1(tot.p)+": dovrebbe essere 100.");
  const T=num(q.tempo);

  else if(P.senzaPreset){if(T&&tot.m>T)add("warn","I tempi sommano "+tot.m+" minuti: superano i "+T+" disponibili.");}
  else if(!T)add("warn","Il tempo disponibile non è impostato.");
  else if(P.tempoRule==="quota"){
    const k=tot.m/T;
    if(k>0.85)add("warn","I tempi consigliati sommano "+tot.m+" minuti su "+T+": restano pochi minuti per provare il codice e rileggere (previsti circa i tre quarti, "+Math.round(T*0.75)+").");
    else if(k<0.65)add("info","I tempi consigliati sommano "+tot.m+" minuti su "+T+": restano molti minuti liberi (previsti circa i tre quarti, "+Math.round(T*0.75)+").");
  }else{
    if(tot.m>T)add("err","I tempi sommano "+tot.m+" minuti: superano di "+(tot.m-T)+" i "+T+" disponibili.");
    else if(T-tot.m<5)add("warn","Il margine è di "+(T-tot.m)+" minuti: ne servono almeno 5 per gli imprevisti.");
  }
  if(!String(q.lezione||"").trim())add("info","Il numero di lezione non è impostato: i nomi delle domande mostrano «L?».");
  const byPag={};rows.forEach(function(r){if(contaRiga(rows,r))(byPag[r.pag]=byPag[r.pag]||[]).push(r);});
  /* una pagina di spiegazione (descrizione) può introdurre una domanda complessa sulla stessa pagina del quiz: conta solo le domande */
  Object.keys(byPag).forEach(function(pg){const rs=byPag[pg].filter(function(r){return !(CAT[r.tipologia]&&CAT[r.tipologia].pagina);});if(rs.length>1&&rs.some(function(r){return CAT[r.tipologia]&&CAT[r.tipologia].propria;}))add("warn","Pagina "+pg+": contiene "+rs.map(function(r){return r.pos||"?";}).join(", ")+", ma le domande di programmazione stanno su una pagina da sole.",rs[0].id);});
  for(let i=1;i<rows.length;i++)if(num(rows[i].pag)<num(rows[i-1].pag)){add("warn","Il numero di pagina scende da "+rows[i-1].pag+" ("+rows[i-1].pos+") a "+rows[i].pag+" ("+rows[i].pos+").",rows[i].id);break;}
  if(tot.man)add("info",tot.man+(tot.man===1?" domanda richiede":" domande richiedono")+" la correzione a mano ("+f1(tot.manP)+" punti).");
  P.gruppi.forEach(function(g){
    const a=gr[g.id],tp=target(g,"p"),tm=target(g,"m");
    if(tp&&off(a.p,tp))add("warn",g.n+": "+f1(a.p)+" punti, l'obiettivo è "+tp.label+".");
    if(tm&&off(a.m,tm))add("info",g.n+": "+f1(a.m)+" minuti, previsti "+tm.label+".");
  });
  if(P.seq){
    [[5,"il debugging"],[6,"l'esercizio guidato"],[7,"l'esercizio finale"]].forEach(function(x){if(!rows.some(function(r){return Number(r.parte)===x[0];}))add("warn","Manca "+x[1]+".");});
    const secs={};rows.forEach(function(r){(secs[r.sezione]=secs[r.sezione]||[]).push(r);});
    Object.keys(secs).forEach(function(s){const rs=secs[s];const i4=rs.findIndex(function(r){return Number(r.parte)===4;}),i5=rs.findIndex(function(r){return Number(r.parte)===5;});if(i4>=0&&i5>=0&&i5<i4)add("warn",s+": il debugging ("+rs[i5].pos+") viene prima del completamento ("+rs[i4].pos+").",rs[i5].id);});
    rows.forEach(function(r){if(Number(r.parte)===5&&r.tipologia&&["trova_errore","debug_msg","debug_silenzioso"].indexOf(r.tipologia)<0)add("warn",r.pos+": una domanda di debugging dovrebbe essere «Trova l'errore» o «Debug».",r.id);});
    const SO={"quanti-dove":2,"solo-quanti":1,"nulla":0},deb=rows.filter(function(r){return Number(r.parte)===5;});
    const noS=deb.filter(function(r){return !(r.sostegno in SO);});
    if(noS.length)add("info","Sostegno non deciso per "+noS.map(function(r){return r.pos;}).join(", ")+".",noS[0].id);
    const sq=deb.filter(function(r){return r.sostegno in SO;});
    for(let i=1;i<sq.length;i++)if(SO[sq[i].sostegno]>SO[sq[i-1].sostegno]){add("warn","Il sostegno nel debugging cresce da "+sq[i-1].pos+" a "+sq[i].pos+": dovrebbe calare lungo la sequenza.",sq[i].id);break;}
    const st=rows.filter(function(r){return [4,6,7].indexOf(Number(r.parte))>=0&&!r.strumento;});
    if(st.length)add("info","Strumento non deciso per "+st.map(function(r){return r.pos;}).join(", ")+".",st[0].id);
    const fin=rows.filter(function(r){return Number(r.parte)===7;});
    if(fin.length>1&&fin.every(function(r){return r.strumento==="suggerito";}))add("info","Tutti gli esercizi finali suggeriscono lo strumento: nessuno chiede di sceglierlo da solo.",fin[fin.length-1].id);
  }
  const ord={err:0,warn:1,info:2};
  return out.map(function(x,i){return {x:x,i:i};}).sort(function(a,b){return ord[a.x.sev]-ord[b.x.sev]||a.i-b.i;}).map(function(o){return o.x;});

/* obiettivo di una parte: {a,b,tol,label}; null se non definito */
function target(g,k){
  const v=g[k];if(v==null)return null;
  if(Array.isArray(v))return {a:v[0],b:v[1],tol:0,label:v[0]+"–"+v[1]};

}
function off(val,t){return val<t.a-t.tol-1e-9||val>t.b+t.tol+1e-9;}

async function avviaSessione(id,titolo,materiale){
  let motivo="";
  try{
    const trig=triggerAvvio();
    const mcp=trig?await window.claude.use("mcp"):null;
    if(!trig)motivo="L'avvio automatico non è configurato in questa dashboard: chiedi a Claude di installarlo («installa la dashboard dei quiz»).";
    else if(!mcp)motivo="Da questa vista la pagina non può usare il connettore Claude Code Remote.";
    else{await mcp.callTool(CONNETTORE,"fire_trigger",{trigger_id:trig,text:"Quiz da avviare: "+id});
      save("quiz/"+id,{avviato:new Date().toISOString()});
      S.avvio={id:id,titolo:titolo,ok:true,materiale:materiale};S.inviando=false;render();return;}
  }catch(e){
    const c=e&&e.code;
    motivo=c==="not_in_manifest"||c==="consent_required"||c==="approval_required"?"Il connettore Claude Code Remote non è stato autorizzato per questa pagina.":
      c==="server_not_connected"||c==="needs_reauth"?"Il connettore Claude Code Remote non è collegato al tuo account (Impostazioni → Connettori).":
      "Avvio non riuscito"+(c?" ("+c+")":"")+".";
  }
  S.avvio={id:id,titolo:titolo,ok:false,motivo:motivo,materiale:materiale};S.inviando=false;render();
}
async function inizia(){
  const n=S.nuovo||nuovoVuoto(),manca=[];
  if(!n.tipoQuiz)manca.push("tipo di quiz");if(!String(n.titolo).trim())manca.push("titolo");
  if(!n.classe)manca.push("classe");if(!String(n.argomento).trim())manca.push("argomento");if(!(num(n.tempo)>0))manca.push("tempo");if(!String(n.richiesta).trim())manca.push("richiesta");
  S.nuovoErr=manca;if(manca.length)return render();
  if(!S.db)return;
  S.inviando=true;render();
  if(!String(n.lezione||"").trim())n.lezione=codiceCasuale(n.classe);
  const id=idNuovo(n),ver=n.tipoQuiz==="V"||n.tipoQuiz==="VT";
  const doc={titolo:String(n.titolo).trim(),tipoQuiz:n.tipoQuiz,lezione:String(n.lezione).trim(),classe:n.classe,argomento:String(n.argomento).trim(),tempo:num(n.tempo),
    linguaggio:n.linguaggio||"",varianti:ver?Number(n.varianti)||1:1,avanzata:n.tipoQuiz==="V"?String(n.avanzata||"").trim():"",richiesta:String(n.richiesta).trim(),materiale:!!n.materiale,
    fase:"richiesta",note:"",creato:new Date().toISOString()};
  if(n.tipoQuiz==="LIB")doc.presetMbz=n.presetMbz==="verifica"?"verifica":"esercitazione";
  if(n.linguaggio==="html-css")doc.prototipoHtml=n.prototipoHtml==="html"?"html":"php_con_test";
  try{await S.db.doc("quiz/"+id).set(doc);}catch(e){S.inviando=false;toast("Non sono riuscito a salvare il quiz"+(e&&e.code?" ("+e.code+")":"")+".",true);return render();}
  S.quizId=id;S.nuovo=null;S.nuovoErr=[];
  avviaSessione(id,doc.titolo,doc.materiale);
}

  else if(!S.ready)main.innerHTML='<p class="empty">Caricamento…</p>';
  else if(S.view==="home")main.innerHTML=homeHTML();
  else if(S.view==="nuovo")main.innerHTML=nuovoHTML();
  else if(!S.quiz)main.innerHTML=emptyHTML();
  else if(S.rowsFor!==S.quizId)main.innerHTML='<p class="empty">Caricamento…</p>';
  else main.innerHTML=S.view==="scaletta"?scalettaHTML():dettaglioHTML();
  /* l'elenco del dettaglio non torna in cima a ogni clic: si conserva lo scorrimento, e la domanda scelta resta visibile */
  /* dopo il primo caricamento dei dati si torna alla posizione di scorrimento salvata */
  if(S.restoreY!=null&&S.ready&&(S.view==="home"||(S.quiz&&S.rowsFor===S.quizId))){const y=S.restoreY;S.restoreY=null;requestAnimationFrame(function(){window.scrollTo(0,y);});}
  else if(S.restoreY!=null&&S.ready&&!S.quiz&&S.view!=="home"){S.restoreY=null;}
  const dl=main.querySelector(".dlist");
  if(dl){if(listaTop!=null)dl.scrollTop=listaTop;mostraCorrente(dl);}
  const all=[].slice.call(main.querySelectorAll("[data-k]"));
  all.forEach(function(x){if(Object.prototype.hasOwnProperty.call(S.dirty,x.dataset.k)&&x.value!==S.dirty[x.dataset.k])x.value=S.dirty[x.dataset.k];});
  const want=S.focusKey||fk;
  if(want){const t=all.find(function(x){return x.dataset.k===want;});if(t){t.focus();if(!S.focusKey&&ss!=null){try{t.setSelectionRange(ss,se);}catch(e){}}}S.focusKey=null;}
  const sa=$("#avvisi");if(sa)sa.addEventListener("toggle",function(){S.avvisiOpen=sa.open;});
  const sn=$("#note");if(sn)sn.addEventListener("toggle",function(){S.noteOpen=sn.open;});
  const sd=$("#dbp");if(sd)sd.addEventListener("toggle",function(){S.dbOpen=sd.open;});
  const sg=$("#gestione");if(sg)sg.addEventListener("toggle",function(){S.gestOpen=sg.open;});
  const sgt=$("#guidaTipi");if(sgt)sgt.addEventListener("toggle",function(){S.guidaOpen=sgt.open;});
  const si=$("#imp");if(si)si.addEventListener("toggle",function(){S.impOpen=si.open;});
  const st=$("#impTrigger");if(st)st.addEventListener("input",function(){S.impBozza=st.value;});
  persist();
}

/* ------------------------------------------------------------------ azioni */
function approvaRighe(){let n=0;S.rows.forEach(function(r){if(r.stato!=="approvata"){n++;save(rowPath(r.id),{stato:"approvata"});}});if(n)toast("Dettaglio approvato: "+n+(n===1?" domanda segnata «approvata».":" domande segnate «approvata»."));}
function riapriScaletta(motivo){
  const q=S.quiz;if(!q||!q.fase||q.fase==="scaletta-revisione")return;
  save(quizPath(),{fase:"scaletta-revisione"});
  toast(motivo+": la scaletta torna in revisione e va approvata di nuovo.");
}
function move(id,dir){
  const U=unita(S.rows),i=U.findIndex(function(u){return u.id===id||u.rows.some(function(r){return r.id===id;});}),j=i+dir;
  if(i<0||j<0||j>=U.length)return;
  const ordini=S.rows.map(function(r){return num(r.ordine);}).sort(function(a,b){return a-b;});
  const sez=U[j].r.sezione!==U[i].r.sezione?U[j].r.sezione:null;
  const tmp=U[i];U[i]=U[j];U[j]=tmp;
  let k=0;
  U.forEach(function(u){u.rows.slice().sort(function(a,b){return num(a.ordine)-num(b.ordine);}).forEach(function(r){
    const o=ordini[k++],pa={};if(num(r.ordine)!==o)pa.ordine=o;
    if(sez!==null&&u===tmp&&r.sezione!==sez)pa.sezione=sez;
    if(Object.keys(pa).length)save(rowPath(r.id),pa);});});
  riapriScaletta("Hai spostato una domanda");
  S.focusKey=null;
}
function ordineDopo(rs,ultimo,n){
  const sorted=rs.slice().sort(function(a,b){return num(a.ordine)-num(b.ordine);}),i=sorted.indexOf(ultimo),next=i>=0?sorted[i+1]:null;
  const a=ultimo?num(ultimo.ordine):(sorted.length?num(sorted[sorted.length-1].ordine):0);
  const step=next?(num(next.ordine)-a)/(n+1):10;
  const out=[];for(let k=1;k<=n;k++)out.push(a+step*k);return out;
}
const CAMPI_COMUNI=["sezione","pag","titolo","tipologia","parte","punti","minuti","strumento","sostegno","tag"];
function riga0(){return {pos:"",sintesi:"",stato:"proposta",traccia:"",correzione:"",coderunner:"",docente:"",nota:""};}
function addVariant(gid){
  if(!S.db)return;
  const u=unitaDi(S.rows,gid);if(!u)return;
  const lett=u.rows.map(lettera).filter(Boolean).sort(),nl=lett.length?String.fromCharCode(lett[lett.length-1].charCodeAt(0)+1):"a";
  const ultimo=u.rows.slice().sort(function(a,b){return num(a.ordine)-num(b.ordine);}).pop();
  const o=ordineDopo(S.rows,ultimo,1)[0],d=riga0();
  CAMPI_COMUNI.forEach(function(f){d[f]=u.r[f]==null?"":u.r[f];});
  d.ordine=o;d.pos=basePos(u.r)+nl;
  const ref=S.db.collection("quiz/"+S.quizId+"/domande").doc();
  S.openG=S.openG||{};S.openG[gid]=true;S.focusKey=ref.id+":sintesi";
  ref.set(d).then(function(){toast("Variante "+d.pos+" aggiunta.");}).catch(function(){S.focusKey=null;toast("Non sono riuscito ad aggiungere la variante.",true);});
}
function salvaGruppo(gid,f,v){
  const u=unitaDi(S.rows,gid);if(!u)return;
  if(f==="pos"){
    const base=String(v).trim().replace(/[a-z]$/,"");
    const nt=tagProvvisorio(u.tag)&&base?tagPer(S.quiz,base,u.r.titolo):null;
    u.rows.forEach(function(r){const pa={pos:base+lettera(r)};if(nt)pa.tag=nt;save(rowPath(r.id),pa);});return;
  }
  if(f==="tag")v=String(v).trim();
  const pa={};pa[f]=v;
  if(f==="titolo"&&tagProvvisorio(u.tag)&&basePos(u.r))pa.tag=tagPer(S.quiz,basePos(u.r),v);
  u.rows.forEach(function(r){save(rowPath(r.id),pa);});
}
function addPosizione(sec,nv){
  const rs=S.rows,inSec=rs.filter(function(r){return r.sezione===sec;}),last=inSec.slice().sort(function(a,b){return num(a.ordine)-num(b.ordine);}).pop();
  const prev=last||rs[rs.length-1],ordini=ordineDopo(rs,last||null,nv);
  const tag=slug(String(S.quiz.lezione||"").trim()||S.quizId).replace(/-/g,"")+"-nuova-"+Math.random().toString(36).slice(2,6);
  const refs=[];
  const lavori=ordini.map(function(o,k){
    const ref=S.db.collection("quiz/"+S.quizId+"/domande").doc();refs.push(ref);
    const d=riga0();d.ordine=o;d.sezione=sec;d.pos=String.fromCharCode(97+k);d.pag=(prev?num(prev.pag):0)+1;d.titolo="";d.tipologia="";d.parte=prev?prev.parte:1;
    d.punti=0;d.minuti=0;d.strumento="";d.sostegno="";d.tag=tag;
    return ref.set(d);
  });
  S.focusKey="grp:"+refs[0].id+":titolo";
  Promise.all(lavori).then(function(){riapriScaletta("Hai aggiunto una domanda con "+nv+" varianti");}).catch(function(){S.focusKey=null;toast("Non sono riuscito ad aggiungere la domanda.",true);});
}
function removeRow(id){if(!S.db)return;S.db.doc(rowPath(id)).delete().then(function(){riapriScaletta("Hai eliminato una domanda");}).catch(function(){toast("Eliminazione non riuscita.",true);});}
function addRow(sec){
  if(!S.db)return;
  const GT=gruppiTag(S.rows),nv=Object.keys(GT).reduce(function(m,k){return Math.max(m,GT[k].length);},0);
  if(nv>1)return addPosizione(sec,nv);
  const rs=S.rows,inSec=rs.filter(function(r){return r.sezione===sec;}),last=inSec[inSec.length-1];
  const li=last?rs.indexOf(last):-1,next=li>=0?rs[li+1]:null;
  const ordine=last?(next?(last.ordine+next.ordine)/2:last.ordine+10):((rs.length?rs[rs.length-1].ordine:0)+10);
  const ref=S.db.collection("quiz/"+S.quizId+"/domande").doc();
  const prev=last||rs[rs.length-1];
  S.focusKey=ref.id+":titolo";
  ref.set({ordine:ordine,sezione:sec,pos:"",pag:(prev?num(prev.pag):0)+1,titolo:"",sintesi:"",tipologia:"",parte:prev?prev.parte:4,punti:0,minuti:0,strumento:"",sostegno:"",stato:"proposta",traccia:"",correzione:"",coderunner:"",docente:"",nota:""})
    .then(function(){riapriScaletta("Hai aggiunto una domanda");}).catch(function(){S.focusKey=null;toast("Non sono riuscito ad aggiungere la domanda.",true);});
}
function renumber(){
  const map={};let n=0;
  S.rows.forEach(function(r){if(!(r.pag in map))map[r.pag]=++n;});
  let c=0;S.rows.forEach(function(r){if(map[r.pag]!==r.pag){c++;save(rowPath(r.id),{pag:map[r.pag]});}});
  toast(c?"Pagine rinumerate: "+c+(c===1?" riga cambiata.":" righe cambiate."):"Le pagine sono già in sequenza.");
}
function gotoRow(id){
  S.view="scaletta";
  const u=unitaDi(S.rows,id);if(u&&u.tag){S.openG=S.openG||{};S.openG[u.id]=true;}
  render();
  const tr=document.getElementById("r-"+id)||(u?document.getElementById("g-"+u.id):null);if(!tr)return;
  tr.scrollIntoView({block:"center"});tr.classList.add("flash");setTimeout(function(){tr.classList.remove("flash");},1900);
}
function stepSel(d){
  const U=unita(S.rows),i=U.findIndex(function(u){return u.rows.some(function(r){return r.id===S.sel;});}),j=i+d;
  if(i<0||j<0||j>=U.length)return;
  const cur=S.rows.find(function(r){return r.id===S.sel;}),l=cur?lettera(cur):"";
  const t=U[j].rows.find(function(r){return l&&lettera(r)===l;})||U[j].r;
  S.sel=t.id;S.edit=null;render();mostraArticolo();
}
function act(a,d){
  switch(a){
    case "up":return move(d.id,-1);
    case "down":return move(d.id,1);
    case "del":
      if(S.del===d.id){S.del=null;return removeRow(d.id);}
      S.del=d.id;clearTimeout(S.delT);S.delT=setTimeout(function(){S.del=null;render();},4000);return render();
    case "nuovo-quiz":S.view="nuovo";S.avvio=null;S.nuovo=S.nuovo||nuovoVuoto();render();window.scrollTo(0,0);return;
    case "annulla-nuovo":S.view="home";S.nuovo=null;S.nuovoErr=[];S.avvio=null;render();return;
    case "apri-quiz":S.quizId=d.id;S.sel=null;S.edit=null;S.dirty={};S.view="scaletta";if(S.avvio&&S.avvio.ok)S.avvio=null;selectQuiz();render();window.scrollTo(0,0);return;
    case "inizia":if(!S.inviando)inizia();return;
    case "salva-imp":{const el=document.getElementById("impTrigger");if(!el||!S.db)return;const v=el.value.trim();
      if(v&&!/^trig_[A-Za-z0-9]+$/.test(v)){toast("L'id deve cominciare con trig_ ed essere fatto solo di lettere e cifre.",true);return;}
      const doc=Object.assign({},S.imp||{});doc.trigger=v;
      S.db.doc(PERCORSO_IMPOSTAZIONI).set(doc).then(function(){S.impBozza=null;toast(v?"Avvio automatico salvato.":"Avvio automatico tolto.");},function(e){toast("Non sono riuscito a salvare"+(e&&e.code?" ("+e.code+")":"")+".",true);});return;}
    case "riprova-avvio":{const q=S.quizzes.find(function(x){return x.id===d.id;});if(!q)return;S.inviando=true;avviaSessione(q.id,q.titolo||q.id,!!q.materiale);return;}
    case "copia-avvio":{const ta=document.getElementById("testoAvvio");if(!ta)return;const ok=function(){toast("Frase copiata: incollala in una chat con Claude.");};
      try{navigator.clipboard.writeText(ta.value).then(ok,function(){ta.select();toast("Copia non permessa qui: la frase è selezionata, premi Ctrl+C.");});}catch(e){ta.select();toast("La frase è selezionata: premi Ctrl+C.");}return;}
    case "vtog":S.openG=S.openG||{};S.openG[d.id]=!S.openG[d.id];return render();
    case "addvar":return addVariant(d.id);
    case "delvar":
      if(S.del===d.id){S.del=null;return void S.db.doc(rowPath(d.id)).delete().then(function(){toast("Variante eliminata.");}).catch(function(){toast("Eliminazione non riuscita.",true);});}
      S.del=d.id;clearTimeout(S.delT);S.delT=setTimeout(function(){S.del=null;render();},4000);return render();
    case "delgrp":{
      const u=unitaDi(S.rows,d.id);if(!u)return;
      if(S.del===d.id){S.del=null;Promise.all(u.rows.map(function(r){return S.db.doc(rowPath(r.id)).delete();})).then(function(){riapriScaletta("Hai eliminato una domanda");}).catch(function(){toast("Eliminazione non riuscita.",true);});return;}
      S.del=d.id;clearTimeout(S.delT);S.delT=setTimeout(function(){S.del=null;render();},4000);return render();
    }
    case "open":S.sel=d.id;S.view="dettaglio";S.edit=null;render();window.scrollTo(0,0);return;
    case "add":return addRow(d.sec);
    case "addsec":return addRow("Nuova sezione");
    case "renumber":return renumber();
    case "db-add":{const L=dbList(S.quiz);let n="db"+(L.length+1);while(L.some(function(x){return x.nome===n;}))n+="b";L.push({nome:n,sql:""});S.focusKey="db:"+(L.length-1)+":sql";return void save(quizPath(),{database:L});}
    case "db-del":{const i=Number(d.i);if(S.delDb===i){S.delDb=null;const L=dbList(S.quiz);L.splice(i,1);Object.keys(S.dirty).forEach(function(k){if(/^db:/.test(k))delete S.dirty[k];});return void save(quizPath(),{database:L});}
      S.delDb=i;clearTimeout(S.delDbT);S.delDbT=setTimeout(function(){S.delDb=null;render();},4000);return render();}
    case "goto":return gotoRow(d.id);
    case "sel":S.sel=d.id;S.edit=null;render();mostraArticolo();return;
    case "solo-riv":{S.soloRiv=!S.soloRiv;if(S.soloRiv){const cur=S.rows.find(function(x){return x.id===S.sel;});if(!cur||cur.stato!=="da-rivedere"){const f=daRivedere()[0];if(f)S.sel=f.id;}}S.edit=null;render();return;}
    case "approva-riga":{const nx=daRivedere().filter(function(x){return x.id!==d.id;})[0];save(rowPath(d.id),{stato:"approvata"});if(nx&&S.soloRiv){S.sel=nx.id;}return;}
    case "prev":return stepSel(-1);
    case "next":return stepSel(1);
    case "edit":{const r=S.rows.find(function(x){return x.id===S.sel;});if(!r)return;S.edit={id:r.id,traccia:r.traccia||"",correzione:r.correzione||"",coderunner:r.coderunner||"",docente:r.docente||""};render();return;}
    case "cancel-edit":S.edit=null;["traccia","correzione","coderunner","docente"].forEach(function(k){delete S.dirty["draft:"+k];});render();return;
    case "save-edit":{
      const e=S.edit;if(!e)return;
      const pat={traccia:e.traccia,correzione:e.correzione,docente:e.docente};
      const rr=S.rows.find(function(x){return x.id===e.id;});
      if(String(e.coderunner||"")!==String((rr&&rr.coderunner)||""))pat.coderunner=e.coderunner;
      save(rowPath(e.id),pat);
      S.edit=null;["traccia","correzione","coderunner","docente"].forEach(function(k){delete S.dirty["draft:"+k];});render();return;
    }
    case "comment":{
      const el=document.getElementById("q-"+S.sel)||$(".dname");
      if(!S.comments||!el)return;
      Promise.resolve(S.comments.openComposer({element:el})).then(function(r){if(r&&r.opened===false)toast("Chiudi il commento aperto prima di avviarne un altro.");}).catch(function(){toast("Da questa vista non è possibile commentare.",true);});
      return;
    }
    case "approve":{
      const q=S.quiz,nx=q&&NEXT[q.fase];if(!nx)return;
      if(q.fase==="dettaglio-revisione"&&mancanti()>0){toast("Mancano ancora delle tracce: il dettaglio non si può approvare.",true);return;}
      const errs=S.avvCount?S.avvCount.err:0;
      if(errs&&!S.confirmApprove){S.confirmApprove=true;clearTimeout(S.apT);S.apT=setTimeout(function(){S.confirmApprove=false;render();},5000);return render();}
      S.confirmApprove=false;save(quizPath(),{fase:nx[0]});if(nx[0]==="dettaglio-approvato")approvaRighe();return;
    }
    case "archivia":save(quizPath(),{archiviato:true}).then(function(){toast("Quiz archiviato: lo trovi in fondo al menù, tra gli archiviati.");});return;
    case "riattiva":save(quizPath(),{archiviato:false});return;
    case "elimina-quiz":
      if(S.deleting)return;
      if(S.delQuiz===S.quizId){return void eliminaQuiz();}
      S.delQuiz=S.quizId;clearTimeout(S.delQT);S.delQT=setTimeout(function(){S.delQuiz=null;render();},6000);
      S.gestOpen=true;
      return render();
    case "back":{
      const q=S.quiz,pv=q&&PREV[q.fase];if(!pv)return;
      save(quizPath(),{fase:pv});return;
    }
  }
}
main.addEventListener("click",function(e){const b=e.target.closest("[data-act]");if(b&&main.contains(b))act(b.dataset.act,b.dataset);});
main.addEventListener("input",function(e){
  const t=e.target;
  if(t.dataset.draft&&S.edit){S.edit[t.dataset.draft]=t.value;return;}
  if(t.dataset.nv){S.nuovo[t.dataset.nv]=t.type==="checkbox"?t.checked:t.value;if(t.dataset.nv==="tipoQuiz"||t.dataset.nv==="linguaggio"){render();}return;}
  if(t.dataset.k)S.dirty[t.dataset.k]=t.value;
});
main.addEventListener("change",function(e){
  const t=e.target;
  if(t.dataset.grp){
    let v=t.value;
    if(t.dataset.t==="n")v=Math.max(0,num(v));
    if(t.dataset.t==="parte")v=Number(v);
    delete S.dirty[t.dataset.k];
    return void salvaGruppo(t.dataset.grp,t.dataset.f,v);
  }
  if(t.dataset.f&&t.dataset.id){
    let v=t.value;
    if(t.dataset.t==="n")v=Math.max(0,num(v));
    if(t.dataset.t==="parte")v=Number(v);
    delete S.dirty[t.dataset.k];
    return void save(rowPath(t.dataset.id),(function(){const o={};o[t.dataset.f]=v;return o;})());
  }
  if(t.dataset.db!==undefined){
    const L=dbList(S.quiz),i=Number(t.dataset.db);if(!L[i])return;
    L[i][t.dataset.dbf]=t.dataset.dbf==="nome"?t.value.trim():t.value;
    delete S.dirty[t.dataset.k];
    return void save(quizPath(),{database:L});
  }
  if(t.dataset.q){
    let v=t.value;if(t.dataset.t==="n")v=Math.max(0,num(v));
    delete S.dirty[t.dataset.k];
    if(t.dataset.q==="fase"&&v==="dettaglio-approvato")approvaRighe();
    return void save(quizPath(),(function(){const o={};o[t.dataset.q]=v;return o;})());
  }
  if(t.dataset.sec!==undefined){
    const old=t.dataset.sec,nv=t.value.trim()||old;delete S.dirty[t.dataset.k];
    if(nv!==old)S.rows.filter(function(r){return r.sezione===old;}).forEach(function(r){save(rowPath(r.id),{sezione:nv});});
  }
});
$("#quizSel").addEventListener("change",function(e){S.quizId=e.target.value;if(S.view==="home"||S.view==="nuovo")S.view="scaletta";S.sel=null;S.edit=null;S.dirty={};selectQuiz();render();});
document.querySelector(".tabs").addEventListener("click",function(e){const b=e.target.closest("[data-view]");if(!b)return;S.view=b.dataset.view;S.edit=null;render();window.scrollTo(0,0);});

/* ------------------------------------------------------------------ dati */
function selectQuiz(){
  S.quiz=S.quizzes.find(function(q){return q.id===S.quizId;})||null;
  if(S.rowsFor===S.quizId||!S.db||!S.quiz)return;
  if(S.unsubRows){S.unsubRows();S.unsubRows=null;}
  S.rows=[];S.rowsFor=null;
  const id=S.quizId;
  S.unsubRows=S.db.collection("quiz/"+id+"/domande").onSnapshot(function(snap){
    if(S.quizId!==id)return;
    S.rows=snap.docs.map(function(d){const o=Object.assign({},d.data()||{});o.id=d.id;return o;}).sort(function(a,b){return num(a.ordine)-num(b.ordine);});
    S.rowsFor=id;render();
  },function(err){if(err&&err.code==="revoked"){S.error="revoked";}else toast("Non riesco a leggere le domande del quiz.",true);render();});
}
async function init(){
  render();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){S.error="nodb";render();return;}
  S.db=db;
  db.doc(PERCORSO_IMPOSTAZIONI).onSnapshot(function(snap){S.imp=snap.exists?Object.assign({},snap.data()||{}):{};render();},function(){S.imp={};render();});
  db.collection("quiz").onSnapshot(function(snap){
    S.quizzes=snap.docs.map(function(d){const o=Object.assign({},d.data()||{});o.id=d.id;return o;}).sort(function(a,b){return String(a.titolo||a.id).localeCompare(String(b.titolo||b.id),"it");});
    if(!S.quizzes.some(function(q){return q.id===S.quizId;})){const a=S.quizzes.find(function(q){return !q.archiviato;})||S.quizzes[0];S.quizId=a?a.id:null;}
    S.ready=true;selectQuiz();render();
  },function(err){if(err&&err.code==="revoked")S.error="revoked";else toast("Non riesco a leggere i quiz.",true);render();});
  try{const c=await window.claude.use("comments");if(c&&c.openComposer){S.comments=c;render();}}catch(e){}
}
init();
})();
