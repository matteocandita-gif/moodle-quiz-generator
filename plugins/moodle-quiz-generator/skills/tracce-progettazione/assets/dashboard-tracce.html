<title>Tracce di progettazione</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: elenco delle tracce, poi una scheda per traccia con quattro viste (traccia, note, soluzione, uscite).
   Colori del diagramma E/R del libro: l'azzurro delle entità come accento, neutri con una punta di blu. */
:root{
  --bg:#f3f5f9; --panel:#ffffff; --panel-2:#eaeef5; --ink:#18212e; --muted:#566275; --line:#d4dbe6; --line-2:#e4e9f0;
  --accent:#2c5d93; --accent-ink:#ffffff; --entity:#dae8fc; --entity-line:#6c8ebf; --sheet:#ffffff;
  --st-richiesta:#5a6678; --st-richiesta-bg:#e8ecf2; --st-lavoro:#6a4aa0; --st-lavoro-bg:#ece5f7;
  --st-rivedere:#8a5a00; --st-rivedere-bg:#fbeacb; --st-approvata:#1f7346; --st-approvata-bg:#dcf0e3;
  --st-usata:#2c5d93; --st-usata-bg:#dde9f8; --bad:#ad2f25; --bad-bg:#fbe2df; --code:#eef2f7;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151d; --panel:#18202b; --panel-2:#212b38; --ink:#e3e9f1; --muted:#9aa7b8; --line:#2c3847; --line-2:#253040;
  --accent:#86b3e6; --accent-ink:#0d1622; --entity:#1f3550; --entity-line:#5f86b8; --sheet:#1b2430;
  --st-richiesta:#a8b4c4; --st-richiesta-bg:#253040; --st-lavoro:#bba2ec; --st-lavoro-bg:#2a2140;
  --st-rivedere:#f0bc5e; --st-rivedere-bg:#3a2b10; --st-approvata:#6ccb95; --st-approvata-bg:#173225;
  --st-usata:#86b3e6; --st-usata-bg:#18283b; --bad:#ff8e84; --bad-bg:#40201c; --code:#141b25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --panel:#18202b; --panel-2:#212b38; --ink:#e3e9f1; --muted:#9aa7b8; --line:#2c3847; --line-2:#253040;
  --accent:#86b3e6; --accent-ink:#0d1622; --entity:#1f3550; --entity-line:#5f86b8; --sheet:#1b2430;
  --st-richiesta:#a8b4c4; --st-richiesta-bg:#253040; --st-lavoro:#bba2ec; --st-lavoro-bg:#2a2140;
  --st-rivedere:#f0bc5e; --st-rivedere-bg:#3a2b10; --st-approvata:#6ccb95; --st-approvata-bg:#173225;
  --st-usata:#86b3e6; --st-usata-bg:#18283b; --bad:#ff8e84; --bad-bg:#40201c; --code:#141b25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 64px;display:flex;flex-direction:column;gap:18px}
#main{display:flex;flex-direction:column;gap:16px;min-width:0}
.testa{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.testa h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
.testa p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 13px;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primario:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.piccolo{padding:3px 9px;font-size:.8rem}
.btn.pericolo{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.pericolo.pieno{background:var(--bad);color:var(--panel);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.ctl{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px;min-width:0;max-width:100%}
textarea.ctl{width:100%;resize:vertical;line-height:1.5}
.ctl:focus{border-color:var(--accent);outline:none}
.vuoto{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:26px 20px;text-align:center;color:var(--muted)}
.vuoto strong{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 15px;border-radius:8px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}
/* stati */
.st{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;letter-spacing:.02em;border-radius:99px;padding:1px 9px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-richiesta{color:var(--st-richiesta);background:var(--st-richiesta-bg)}
.st-lavoro{color:var(--st-lavoro);background:var(--st-lavoro-bg)}
.st-da-rivedere{color:var(--st-rivedere);background:var(--st-rivedere-bg)}
.st-approvata{color:var(--st-approvata);background:var(--st-approvata-bg)}
.st-usata{color:var(--st-usata);background:var(--st-usata-bg)}
.chip{font-size:.74rem;font-weight:600;color:var(--muted);background:var(--panel-2);border-radius:5px;padding:1px 7px;white-space:nowrap}
.chip.preset{background:var(--entity);color:var(--ink);border:1px solid var(--entity-line)}
/* elenco */
.filtri{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtri .ctl{flex:1 1 200px}
.elenco{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.carta{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.carta:hover{border-color:var(--accent)}
.carta h3{font-size:1.02rem;font-weight:700;overflow-wrap:anywhere}
.carta .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.carta .desc{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.carta .data{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
details.riquadro{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.riquadro>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
details.riquadro>summary::-webkit-details-marker{display:none}
details.riquadro>.dentro{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
/* moduli */
.sezione{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sezione h2{font-size:1.08rem;font-weight:700}
.sezione .sub{font-size:.86rem;color:var(--muted);margin:-6px 0 0}
.preset{display:flex;flex-wrap:wrap;gap:8px}
.preset button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;text-align:left;min-width:150px;flex:1 1 150px}
.preset button b{display:block}
.preset button span{font-size:.8rem;color:var(--muted)}
.preset button[aria-pressed="true"]{border-color:var(--entity-line);background:var(--entity)}
.voci{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0}
.campo>span{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.campo.cambiato>span::after{content:" · modificato";text-transform:none;letter-spacing:0;font-weight:600;color:var(--st-rivedere)}
.riga{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.errore{color:var(--bad);font-size:.88rem}
.avviso{background:var(--st-rivedere-bg);border-radius:9px;padding:10px 14px;font-size:.9rem}
.avviso.ok{background:var(--st-approvata-bg)}
.avviso textarea{margin-top:8px;font-family:var(--f-mono);font-size:.8rem}
/* scheda */
.indietro{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.schede{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.schede button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.schede button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.foglio{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:22px clamp(16px,4vw,40px);box-shadow:0 1px 0 var(--line-2);display:flex;flex-direction:column;gap:12px;min-width:0}
.foglio .titolo-c{font-weight:700;font-size:1.06rem}
.foglio p{margin:0;max-width:72ch}
.foglio ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.foglio .etic{font-weight:700}
.blocco{display:flex;flex-direction:column;gap:6px}
.blocco-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blocco-t h3{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.query-riga{display:grid;grid-template-columns:28px minmax(0,1fr) 110px;gap:8px;align-items:start;border-top:1px solid var(--line-2);padding-top:8px}
.query-riga .n{font-family:var(--f-mono);font-weight:600;padding-top:6px;color:var(--muted)}
.query-riga .req{grid-column:2 / -1}
.lista-note{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
pre.codice{background:var(--code);border:1px solid var(--line);border-radius:7px;padding:10px 12px;font:12.5px/1.5 var(--f-mono);overflow-x:auto;white-space:pre;margin:0}
.md table{border-collapse:collapse;font-size:.84rem;width:100%}
.md th,.md td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.md th{background:var(--panel-2)}
.md .tabella{overflow-x:auto}
.md p{margin:0 0 8px}
.diagramma{background:#ffffff;border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}
.diagramma img{display:block;width:100%;min-width:680px;height:auto}
.griglia{overflow-x:auto}
.griglia table{border-collapse:collapse;font-size:.86rem;min-width:520px;width:100%}
.griglia th,.griglia td{border-bottom:1px solid var(--line-2);padding:6px 8px;text-align:left}
.griglia td.num,.griglia th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.8rem}
.griglia input{width:4.2em;text-align:right}
.griglia tfoot td{font-weight:700;border-bottom:0}
.conferma{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--bad);font-size:.9rem}
.mini{font-size:.8rem}
@media (max-width:620px){.query-riga{grid-template-columns:24px minmax(0,1fr)}.query-riga select{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

<style>
/* Barra di navigazione tra le pagine del plugin: una fascia scura, di colore diverso dalla pagina che la ospita,

.mqg-nav{--mqg-bg:#24304f;--mqg-tx:#e8ecf7;--mqg-tx2:#aeb9d6;--mqg-hv:rgba(255,255,255,.12);--mqg-qbg:#e8ecf7;--mqg-qtx:#1b2440;

@media (prefers-color-scheme:dark){.mqg-nav{--mqg-bg:#3a4c80;--mqg-tx:#f1f4fb;--mqg-tx2:#c3cde6;--mqg-hv:rgba(255,255,255,.14);--mqg-qbg:#f1f4fb;--mqg-qtx:#1b2440}}
.mqg-nav[hidden]{display:none!important}
.mqg-nav .mqg-l{margin-right:8px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mqg-tx2)}

.mqg-nav a::after{content:"\2197";margin-left:4px;font-size:.85em;color:var(--mqg-tx2)}
.mqg-nav a:hover{background:var(--mqg-hv);text-decoration:underline;text-underline-offset:2px}
.mqg-nav a:focus-visible{outline:2px solid var(--mqg-tx);outline-offset:1px}
.mqg-nav .mqg-qui{font-weight:700;background:var(--mqg-qbg);color:var(--mqg-qtx)}

</style>
<script>
(function(){
  "use strict";
  /* Le pagine del plugin: chiave nel documento impostazioni/navigazione e titolo della pagina.
     La pagina corrente si riconosce dal titolo (document.title comincia con il nome). */
  var PAGINE=[["bozze","Bozze dei quiz"],["tracce","Tracce di progettazione"],["correzioni","Correzione verifiche"],["mappe","Mappe dei prerequisiti"]];
  var nav=document.getElementById("mqg-nav");
  if(!nav||!window.claude||!window.claude.use)return;
  function ok(u,soloClaude){u=String(u||"");return soloClaude?/^https:\/\/claude\.ai\/(code\/)?artifact\//.test(u):/^https:\/\//.test(u);}
  function link(url,testo){var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.textContent=testo;a.title="Apri «"+testo+"» in una nuova scheda";return a;}
  window.claude.use("db").then(function(db){
    if(!db)return null;
    return db.doc("impostazioni/navigazione").get();
  }).then(function(snap){
    if(!snap||!snap.exists)return;
    var d=snap.data()||{},p=d.pagine||{},titolo=document.title||"",voci=[];
    PAGINE.forEach(function(x){
      var qui=titolo.indexOf(x[1])===0;
      if(qui)voci.push({qui:true,testo:x[1]});
      else if(ok(p[x[0]],true))voci.push({url:p[x[0]],testo:x[1]});
    });
    var altri=(Array.isArray(d.altri)?d.altri:[]).filter(function(a){return a&&ok(a.url)&&a.titolo;});
    if(voci.filter(function(v){return !v.qui;}).length+altri.length===0)return;
    var l=document.createElement("span");l.className="mqg-l";l.textContent="Quiz generator";nav.appendChild(l);
    voci.forEach(function(v){
      if(v.qui){var s=document.createElement("span");s.className="mqg-qui";s.setAttribute("aria-current","page");s.textContent=v.testo;nav.appendChild(s);}
      else nav.appendChild(link(v.url,v.testo));
    });
    if(altri.length){var sep=document.createElement("span");sep.className="mqg-sep";sep.setAttribute("aria-hidden","true");nav.appendChild(sep);
      altri.forEach(function(a){nav.appendChild(link(a.url,String(a.titolo)));});}
    nav.hidden=false;
  }).catch(function(){});
})();
</script>

<script>
/* incluso: uscite_traccia.js — inizio */
/* Uscite di una traccia di progettazione: Word della verifica (anche la copia PDP, con la griglia di
   valutazione) e HTML per la descrizione di un Compito Moodle.
   Un solo modulo per la dashboard «Tracce di progettazione» (nel browser) e per Claude in chat (Node):
     node scripts/uscite_traccia.js TRACCIA.json [--word FILE.docx] [--pdp FILE.docx] [--html FILE.html] [--griglia]
   La traccia è il documento JSON descritto in references/formato.md. Nessuna libreria esterna: il .docx
   è uno zip (non compresso) di XML scritto qui. */
(function (root, factory) {
  var api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.UsciteTraccia = api;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /* ------------------------------------------------------------------ testo */
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  /* **grassetto**, *corsivo* (solo tra spazi: l'asterisco delle chiavi esterne non è corsivo), <u>sottolineato</u> e `codice` in pezzi {t, b, i, u, c} */
  function pezzi(testo) {
    var out = [], re = /(\*\*[^*]+\*\*|<u>.*?<\/u>|`[^`]+`|(?<![^\s(«"])\*[^*\s](?:[^*]*[^*\s])?\*(?![\w*]))/g, s = String(testo || ""), last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) out.push({ t: s.slice(last, m.index) });
      if (m[0].slice(0, 2) === "**") pezzi(m[0].slice(2, -2)).forEach(function (q) { q.b = true; out.push(q); });
      else if (m[0].slice(0, 3) === "<u>") out.push({ t: m[0].slice(3, -4), u: true });
      else if (m[0].charAt(0) === "`") out.push({ t: m[0].slice(1, -1), c: true });
      else out.push({ t: m[0].slice(1, -1), i: true });
      last = m.index + m[0].length;
    }
    if (last < s.length) out.push({ t: s.slice(last) });
    return out;
  }
  var paragrafi = function (s) { return String(s || "").split(/\n\s*\n|\n/).map(function (x) { return x.trim(); }).filter(Boolean); };

  /* ------------------------------------------------------------------ contenuto comune */
  var PRESENTARE = [
    ["er", "Modello E/R completo in tutte le sue componenti."],
    ["documentazione", "Documentazione del progetto."],
    ["relazionale", "Equivalente modello relazionale."],
    ["sql_tabelle", "Definizione in linguaggio SQL di alcune tabelle, con i vincoli di integrità referenziale e di dominio."]
  ];
  function vociPresentare(t) {
    var p = (t.testo && t.testo.presentare) || {};
    return PRESENTARE.filter(function (v) {
      if (v[0] === "documentazione") return p.documentazione !== false;
      if (v[0] === "sql_tabelle") return !!p.sql_tabelle;
      return true;
    }).map(function (v, i) { return { chiave: v[0], testo: v[1], n: i + 1 }; });
  }
  var conPhp = function (t) { return !!(t.testo && t.testo.php && t.testo.php.testo); };
  var conIsa = function (t) {
    var o = t.opzioni || {};
    return o.isa === true || o.isa === "sì" || /\bgerarchia\b/.test((t.docente && t.docente.er) || "");
  };
  var esame = function (t) { return t.uso === "esame"; };
  function riduzione(t, chiave, pdp) {
    if (!pdp) return "";
    var r = (t.pdp && t.pdp.riduzioni) || {};
    return r[chiave] || "";
  }
  var FRASE_IPOTESI = "Tutti gli elementi non esplicitati rimangono a scelta dello studente. Motivare eventualmente le scelte fatte.";
  var FRASE_ORDINE = "Oltre alla correttezza del codice, costituiranno elementi di valutazione anche la struttura e l'ordine dell'esercizio consegnato.";
  var FRASE_QUERY = "Il database così ottenuto dovrà consentire di ricavare le seguenti informazioni:";
  var FRASE_REQUISITI = "tenendo conto anche delle informazioni richieste dalle query";

  /* ------------------------------------------------------------------ griglia */
  var PESI = {
    senzaPhp: { entita: 15, associazioni: 15, vincoli: 15, documentazione: 10, relazionale: 15, query: 30, php: 0 },
    conPhp: { entita: 15, associazioni: 15, vincoli: 10, documentazione: 10, relazionale: 15, query: 20, php: 15 }
  };
  var LIVELLI = ["Insufficiente", "Base (2)", "Sufficiente (3)", "Buono (4)", "Ottimo (5)"];
  var DESCRITTORI = {
    entita: [
      "Il modello presenta gravi mancanze: entità essenziali assenti o scorrette, attributi incompleti o collocati in modo errato, chiavi mancanti o sbagliate e notazione grafica molto imprecisa o incoerente.",
      "Il modello individua solo parte delle entità necessarie; gli attributi sono parzialmente corretti ma non sempre ben posizionati; le chiavi sono individuate in modo incerto; la notazione è irregolare ma ancora interpretabile.",
      "Il modello contiene la maggior parte delle entità corrette e gli attributi principali sono ben collocati; le chiavi sono individuate con solo lievi imprecisioni; la notazione è nel complesso corretta con minimi errori formali.",
      "Tutte le entità e gli attributi richiesti sono presenti e correttamente collocati; le chiavi sono individuate correttamente; la notazione è chiara, coerente e senza errori sostanziali. Qualche imprecisione o scelta non ottimale.",
      "Entità e attributi scelti sono corretti, chiari ed efficaci, senza ridondanze; i dati multipli e quelli derivati sono trattati correttamente. Struttura ordinata e leggibile; eventuali imprecisioni sono marginali."

    case"soluzione":S.inviando=true;render();avvia(t.id,"Soluzione da generare: "+t.id,"Claude genera la soluzione e la scrive nella vista «Soluzione».");return;
    case"riavvia":S.inviando=true;render();avvia(t.id,"Traccia da creare: "+t.id,"Claude scrive la traccia e la porta a «Da rivedere».");return;
    case"copia-avvio":{var ta=$("#testo-avvio");if(ta){ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast("Frase copiata.");},function(){toast("Seleziona la frase e copiala a mano.");});}catch(_){toast("Seleziona la frase e copiala a mano.");}}return;}
    case"word":tt=completa(t);scarica(U.nomeFile(tt),U.docx(tt));return;
    case"word-pdp":tt=completa(t);scarica(U.nomeFile(tt,{pdp:true}),U.docx(tt,{pdp:true}));return;
    case"html":copia(U.html(completa(t)));return;
    case"html-file":tt=completa(t);scarica(U.nomeFile(tt,{estensione:".html"}),new TextEncoder().encode(U.html(tt)));return;
    case"sol-moodle":{tt=completa(t);
      pngDi(t.soluzione).then(function(png){
        if(t.soluzione&&t.soluzione.png&&!png)toast("Diagramma non raggiungibile: l'HTML esce senza diagramma.");
        copia(U.htmlSoluzioneMoodle(tt,png),"HTML della soluzione copiato: incollalo in Moodle in modalità codice sorgente.");
      });return;}
    case"sol-word":case"sol-html":{tt=completa(t);var word=a.dataset.act==="sol-word";
      pngDi(t.soluzione).then(function(png){
        if(t.soluzione&&t.soluzione.png&&!png)toast("Diagramma non raggiungibile: il file esce senza diagramma.");
        if(word)scarica("Soluzione - "+U.nomeFile(tt),U.docxSoluzione(tt,png));
        else scarica("Soluzione - "+U.nomeFile(tt,{estensione:".html"}),new TextEncoder().encode(U.htmlSoluzione(tt,png)));
      });return;}
    case"rid-doc":S.bozza.pdp=S.bozza.pdp||{riduzioni:{}};S.bozza.pdp.riduzioni=S.bozza.pdp.riduzioni||{};S.bozza.pdp.riduzioni["presentare.documentazione"]="Riduzione contenuti per PDP: fornire solo la prima riga delle tabelle di documentazione";segnaSporca();render();return;
    case"pesi-default":S.bozza.griglia={pesi:null};segnaSporca();render();return;
    case"archivia":salva(t.id,{archiviata:!t.archiviata}).then(function(){toast(t.archiviata?"Archiviata.":"Riportata tra le tracce.");});if(!t.archiviata)elenco();return;
    case"elimina-chiedi":S.confermaElimina=true;render();return;
    case"elimina-no":S.confermaElimina=false;render();return;
    case"elimina":S.db.doc("tracce/"+t.id).delete().then(function(){toast("Traccia eliminata.");}).catch(errore);S.sporca=false;S.confermaElimina=false;elenco();return;
  }
});
function salvaBozza(){
  var t=traccia();if(!t)return;var b=S.bozza;
  b.testo.query=(b.testo.query||[]).filter(function(q){return String(q.testo||"").trim();});
  if(b.testo.php&&!String(b.testo.php.testo||"").trim())b.testo.php=null;
  salva(t.id,{titolo:b.titolo,testo:b.testo,pdp:b.pdp,griglia:b.griglia,aggiornato:new Date().toISOString()}).then(function(){S.sporca=false;S.bozza=null;toast("Traccia salvata.");render();});
}
document.addEventListener("input",function(e){
  var el=e.target,b=S.bozza;
  if(el.id==="filtro"){S.filtro=el.value;var pos=el.selectionStart;render();var f=$("#filtro");if(f){f.focus();try{f.setSelectionRange(pos,pos);}catch(_){}}return;}
  if(el.id==="modifica"){S.modifica=el.value;return;}
  if(S.vista==="nuova"&&S.nuova){var n=S.nuova;
    if(el.id==="n-classe")n.classe=el.value;else if(el.id==="n-contesto")n.contesto=el.value;else if(el.id==="n-richiesta")n.richiesta=el.value;return;}
  if(!b)return;
  var x=b.testo;
  if(el.id==="b-titolo")b.titolo=el.value;
  else if(el.id==="b-realta")x.realta=el.value;
  else if(el.id==="b-premessa")x.premessa=el.value;
  else if(el.id==="b-php"){x.php=x.php||{testo:"",connessione:""};x.php.testo=el.value;}
  else if(el.id==="b-conn"){x.php=x.php||{testo:"",connessione:""};x.php.connessione=el.value;}
  else if(el.dataset.q!=null&&el.dataset.qc!=="gradino"){x.query[Number(el.dataset.q)][el.dataset.qc]=el.value;}
  else if(el.dataset.rid){b.pdp=b.pdp||{riduzioni:{}};b.pdp.riduzioni=b.pdp.riduzioni||{};if(el.value.trim())b.pdp.riduzioni[el.dataset.rid]=el.value;else delete b.pdp.riduzioni[el.dataset.rid];}
  else if(el.dataset.peso){var t=traccia(),g=U.griglia(completa(t));b.griglia={pesi:Object.assign({},g.pesi,b.griglia&&b.griglia.pesi||{})};b.griglia.pesi[el.dataset.peso]=Number(el.value)||0;
    if(!S.sporca){S.sporca=true;}var pos=el.id;render();var f=document.getElementById(pos);if(f){f.focus();}return;}
  else return;
  if(!S.sporca){S.sporca=true;var id=el.id,p=el.selectionStart;render();var f2=document.getElementById(id);if(f2){f2.focus();try{f2.setSelectionRange(p,p);}catch(_){}}}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="fstato"){S.fstato=el.value;render();return;}
  if(el.dataset&&el.dataset.op&&S.nuova){S.nuova.opzioni[el.dataset.op]=el.value;render();return;}
  if(el.id==="n-uso"&&S.nuova){S.nuova.uso=el.value;return;}
  if(el.id==="n-data"&&S.nuova){S.nuova.data=el.value||oggi();return;}
  if(el.id==="n-pdp"&&S.nuova){S.nuova.pdp=el.value==="sì";return;}
  if(el.id==="stato"){var t=traccia();if(t)salva(t.id,{stato:el.value,aggiornato:new Date().toISOString()}).then(function(){toast("Stato: "+NOME_STATO[el.value]+".");});return;}
  var b=S.bozza;if(!b)return;
  if(el.id==="b-doc"){b.testo.presentare=b.testo.presentare||{};b.testo.presentare.documentazione=el.checked;segnaSporca();return;}
  if(el.id==="b-sql"){b.testo.presentare=b.testo.presentare||{};b.testo.presentare.sql_tabelle=el.checked;segnaSporca();return;}
  if(el.id==="b-req"){b.testo.requisiti_query=el.checked;segnaSporca();return;}
  if(el.dataset&&el.dataset.qc==="gradino"){b.testo.query[Number(el.dataset.q)].gradino=Number(el.value);segnaSporca();return;}
});

/* ------------------------------------------------------------------ render e dati */
function render(){
  var main=$("#main");
  if(!S.pronto){main.innerHTML=S.senzaDb?'<div class="vuoto"><strong>Le tracce non sono disponibili in questa vista.</strong><br>Apri la pagina da claude.ai, con il tuo account.</div>':'<div class="vuoto">Caricamento delle tracce…</div>';return;}
  var att=document.activeElement,fid=att&&main.contains(att)&&att.id?att.id:null,sel=fid&&"selectionStart" in att?att.selectionStart:null;
  main.innerHTML=S.vista==="nuova"?nuovaHTML():S.vista==="scheda"?schedaHTML():elencoHTML();
  if(fid){var f=document.getElementById(fid);if(f&&f!==document.activeElement){f.focus();if(sel!=null)try{f.setSelectionRange(sel,sel);}catch(_){}}}
}
function daHash(){var h=decodeURIComponent((location.hash||"").slice(1));if(h==="nuova"){S.vista="nuova";S.nuova=S.nuova||nuovaVuota();}else if(h&&S.tracce[h]){S.vista="scheda";S.id=h;}}
window.addEventListener("hashchange",function(){daHash();render();});
render();
(async function(){
  var db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){S.senzaDb=true;render();return;}
  S.db=db;
  db.doc("impostazioni/avvio").get().then(function(s){S.imp=s.exists?Object.assign({},s.data()):{};render();}).catch(function(){S.imp={};});
  var primo=true;
  db.collection("tracce").onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=Object.assign({},d.data(),{id:d.id});});   /* i documenti arrivano congelati: si copiano */
    S.tracce=m;S.pronto=true;
    if(primo){primo=false;daHash();}
    var foc=document.activeElement;
    if(S.sporca&&foc&&/TEXTAREA|INPUT/.test(foc.tagName))return;   // non disturbare chi sta scrivendo
    if(S.vista==="scheda"&&!S.sporca)S.bozza=null;
    render();
  },function(){S.pronto=true;render();});
})();
})();
</script>
