<title>Correzione verifiche</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
/* Layout: elenco delle verifiche; dentro una verifica tre viste (per domanda, per studente, riepilogo) con la barra di navigazione in alto e una scheda per riga */
:root{
  --bg:#eef1ef; --panel:#ffffff; --ink:#1c2622; --muted:#5d6b65; --line:#d3dbd7;
  --accent:#1f6b52; --accent-ink:#ffffff; --accent-soft:#dcebe4; --bar:#13805a;
  --ok:#2c7a4b; --warn:#9a6a00; --bad:#a63a2e; --code:#f5f7f6;
  --f-display:"IBM Plex Serif",Georgia,serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131917; --panel:#1b2320; --ink:#e3ebe7; --muted:#9aa9a2; --line:#2f3a36; --bar:#5fc49c;
  --accent:#5fc49c; --accent-ink:#0c1612; --accent-soft:#1f3a30;
  --ok:#6fcf97; --warn:#e2b14a; --bad:#ef8a7c; --code:#151c19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131917; --panel:#1b2320; --ink:#e3ebe7; --muted:#9aa9a2; --line:#2f3a36; --bar:#5fc49c;
  --accent:#5fc49c; --accent-ink:#0c1612; --accent-soft:#1f3a30;
  --ok:#6fcf97; --warn:#e2b14a; --bad:#ef8a7c; --code:#151c19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1{font-family:var(--f-display);font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.stato{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.indietro{font:inherit;font-size:.85rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;margin-bottom:6px}
.comandi{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:14px}
.ordine{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.ordine button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
.viste{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:max-content;max-width:100%}
.viste button{font:inherit;font-size:.88rem;border:0;background:var(--panel);color:var(--ink);padding:6px 14px;cursor:pointer;border-right:1px solid var(--line)}
.viste button:last-child{border-right:0}
.viste button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5;border-bottom:1px solid var(--line)}
@media (max-width:600px){nav.tabs{position:static}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.tabs button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
nav.tabs button small{color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
nav.tabs button.fatta{border-color:var(--ok)}
nav.tabs button.sigla-tab span{font-family:var(--f-mono)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.intesta{display:grid;gap:8px;margin-bottom:14px}
#comandi + nav.tabs[hidden] + main .intesta{margin-top:16px}
.intesta h2{font-family:var(--f-display);font-size:1.25rem;margin:0}
.criteri{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.9rem;color:var(--muted);white-space:pre-line}
.filtri{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted);align-items:center}
.filtri label{display:flex;gap:6px;align-items:center;cursor:pointer}
.lista{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px 18px}
.card.da-moodle{border-left-color:var(--warn)}
.card.inserito{border-left-color:var(--ok);opacity:.78}
@media (max-width:760px){.card{grid-template-columns:minmax(0,1fr)}}
.chi{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;grid-column:1/-1}
.sigla{font-family:var(--f-mono);font-weight:500;font-size:1rem;background:var(--accent-soft);padding:1px 8px;border-radius:4px}
.dom-tit{font-weight:600}
.n{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.chip{font-size:.75rem;border-radius:999px;padding:1px 8px;border:1px solid currentColor}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)} .chip.muted{color:var(--muted)}
pre.risp{margin:0;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--f-mono);font-size:.8rem;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;min-width:0}
.voto{display:grid;gap:8px;align-content:start;min-width:0}
.riga{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.punti{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.punti input{width:5.2em;font:inherit;font-size:1.1rem;font-weight:600;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:right}
.punti span{color:var(--muted)}
.perc{font-size:.8rem;color:var(--muted)}
.anteprima:empty{display:none}
.anteprima{font-size:.88rem;line-height:1.45;padding:6px 9px;border-left:3px solid var(--line);color:var(--ink)}
.anteprima p{margin:0 0 6px}
.anteprima pre{margin:0 0 6px;padding:6px 9px;background:color-mix(in srgb,var(--line) 30%,transparent);border-radius:6px;overflow-x:auto}
.anteprima pre code{background:none;padding:0;font-size:.82rem}
.anteprima code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em;background:color-mix(in srgb,var(--line) 45%,transparent);padding:1px 4px;border-radius:4px}
textarea{width:100%;min-height:140px;font:inherit;font-size:.88rem;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
.btn{font:inherit;font-size:.82rem;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:6px;padding:4px 10px;cursor:pointer}
.btn.pieno{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.spunte{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem}
.spunte label{display:flex;gap:5px;align-items:center;cursor:pointer}
.nota-moodle{font-size:.8rem;color:var(--muted)}
.nota-moodle b{color:var(--warn);font-weight:600}
.salvato{font-size:.75rem;color:var(--muted);min-height:1em}
.vuoto{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.totale-stud{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-variant-numeric:tabular-nums}
.totale-stud b{font-size:1.3rem}
.totale-stud .voto10{color:var(--accent);font-weight:600;font-size:1.3rem}
.elenco{display:grid;gap:10px}
.verifica{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between;cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.verifica:hover{border-color:var(--accent)}
.verifica h3{font-family:var(--f-display);font-size:1.05rem;margin:0}
.verifica .n{display:block}
.barra{width:160px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--accent)}
.tab-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table.riep{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
table.riep th,table.riep td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.riep th:first-child,table.riep td:first-child{text-align:left;font-family:var(--f-mono)}
table.riep thead th{color:var(--muted);font-weight:500}
table.riep td.tot{font-weight:600}
table.riep td.voto10{font-weight:600;color:var(--accent)}
table.riep td.attesa{color:var(--muted)}
table.riep tbody tr{cursor:pointer}
table.riep tbody tr:hover td{background:var(--accent-soft)}
.leg{font-size:.8rem;color:var(--muted);margin-top:8px}
details.archivio{margin-top:18px;color:var(--muted)}
.riquadro{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:grid;gap:8px}
.riquadro h3{margin:0;font-size:1rem}
.resoconto{margin-top:4px}
.isto{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px 8px}
.isto h3{margin:0 0 2px;font-size:1rem}
.isto .n{display:block;margin-bottom:6px}
.isto svg{display:block;width:100%;height:auto;overflow:visible}
.isto .griglia{stroke:var(--line);stroke-width:1}
.isto .asse{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.isto .soglia{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.isto .barra path{fill:var(--bar)}
.isto .barra .val{fill:var(--ink);font-size:12px;font-weight:600;text-anchor:middle;opacity:0;font-family:var(--f-body)}
.isto .barra:hover path{opacity:.8}
.isto .barra:hover .val{opacity:1}
.isto .barra rect{fill:transparent}
.resoconto h3 .n{font-weight:400;font-size:.8rem}
.res-testo{font-size:.92rem;line-height:1.5}
.res-testo p{margin:0 0 7px}
.res-testo code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em;background:color-mix(in srgb,var(--line) 45%,transparent);padding:1px 4px;border-radius:4px}
.riquadro p{margin:0}
.btn.pericolo{border-color:var(--bad);color:var(--bad)}
.btn.pericolo.pieno{background:var(--bad);color:var(--panel)}
.incolla{border:2px dashed var(--line);border-radius:8px;padding:26px 16px;text-align:center;color:var(--muted);background:var(--panel);cursor:text}
.incolla:focus{outline:2px solid var(--accent);outline-offset:2px;color:var(--ink)}
.imp-q{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem}
.imp-q label{display:flex;gap:5px;align-items:center;cursor:pointer}
select.assegna{font:inherit;font-size:.85rem;padding:2px 4px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px}
.conferma{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:6px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <button class="indietro" id="indietro" hidden>← Tutte le verifiche</button>
      <h1 id="titolo">Correzione verifiche</h1>
      <p class="sub" id="sottotitolo">Le verifiche da correggere, con le proposte di punteggio e commento da riportare in Moodle.</p>
    </div>
    <div class="stato" id="stato">Caricamento…</div>
  </header>
  <div class="comandi" id="comandi" hidden>
    <div class="viste" id="viste" role="group" aria-label="Vista">
      <button data-vista="domanda" aria-pressed="false">Per domanda</button>
      <button data-vista="studente" aria-pressed="false">Per studente</button>
      <button data-vista="riep" aria-pressed="false">Riepilogo voti</button>
      <button data-vista="importa" aria-pressed="false">Importa da Moodle</button>
    </div>
    <div class="ordine">Studenti per cognome <button id="ordine" aria-label="Cambia l'ordine degli studenti">A → Z</button></div>
  </div>
  <nav class="tabs" id="tabs" hidden></nav>
  <main id="vista"><div class="vuoto">Le verifiche compaiono qui appena il database risponde.</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DISCLAIMER_STD = "Il seguente feedback è stato scritto con l'aiuto di una IA generativa. La valutazione è stata svolta dal docente.";
const st = { nuova:false, verifiche:{}, vid:null, domande:{}, val:{}, res:{}, resClasse:null, vista:"domanda", ordine:1, tab:null, stud:null, soloMoodle:false, nascondiRisp:false, db:null, unsub:[] };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => (n == null || n === "" || isNaN(n)) ? "—" : (Math.round(n*100)/100).toString().replace(".", ",");
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1600); }
const CHIAVE_UI = "correzioni-ui";
try { const s = JSON.parse(localStorage.getItem(CHIAVE_UI)||"{}"); Object.assign(st, {vid:s.vid||null, vista:s.vista||"domanda", ordine:s.ordine===-1?-1:1, soloMoodle:!!s.soloMoodle, nascondiRisp:!!s.nascondiRisp}); } catch(e){}
function salvaUI(){ try{ localStorage.setItem(CHIAVE_UI, JSON.stringify({vid:st.vid, vista:st.vista, ordine:st.ordine, soloMoodle:st.soloMoodle, nascondiRisp:st.nascondiRisp})); }catch(e){} }

const info = () => st.verifiche[st.vid] || {};
const disclaimer = () => info().disclaimer || DISCLAIMER_STD;
const domOrd = () => Object.values(st.domande).sort((a,b)=>a.n-b.n);
// ord è la posizione nell'export, che Moodle ordina per cognome: crescente o rovesciato
function righe(d){ return Object.values(st.val).filter(v => v.d === d).sort((a,b)=>(a.ord-b.ord)*st.ordine); }
function studenti(){
  const m = {}; Object.values(st.val).forEach(v => { if (!m[v.k]) m[v.k] = {k:v.k, s:v.s, ord:v.ord}; });
  return Object.values(m).sort((a,b)=>(a.ord-b.ord)*st.ordine);
}
const nStud = () => info().studenti || studenti().length;
const posiz = ord => st.ordine === 1 ? ord + 1 : nStud() - ord;   // posizione nell'ordine scelto, come in Moodle
function rigaDi(d, k){ return st.val[d + "__" + k]; }
// Un commento da riportare in Moodle: non vuoto e diverso da «Risposta non svolta.»
function commentoDaInserire(v){ const c = (v.commento || "").trim(); return !!c && !/^risposta non svolta\.?$/i.test(c); }
function cambiaPunti(v){ return Number(v.punti) !== Number(v.auto); }
function daMoodle(v){
  const dom = st.domande[v.d]; if (!dom || v.punti == null) return false;
  if (dom.tipo === "manuale") return true;
  return cambiaPunti(v) || commentoDaInserire(v);   // automatica: punteggio diverso, oppure stesso punteggio con un commento da dare
}
function aPosto(v){ return v.punti != null && (!daMoodle(v) || !!v.inserito); }   // punteggio deciso e, se serve, già inserito in Moodle
function totale(k){
  let tot = 0, manca = false;
  domOrd().forEach(d => { const v = rigaDi(d.id, k); if (!v || v.punti == null) manca = true; else tot += Number(v.punti); });
  return {tot, manca};
}
const massimo = () => domOrd().reduce((s,d)=>s+Number(d.max||0),0) || 100;
// Nel commento il codice in linea sta tra apici inversi (`let i = 0`) e diventa <code>; un blocco sta tra due righe ```js … ``` e diventa
// <pre><code>, con gli a capo e i rientri. Ogni altra riga è un paragrafo. Nel testo semplice gli apici si tolgono.
const paraHtml = p => esc(p).replace(/`([^`]+)`/g, "<code>$1</code>");
const corpoHtml = c => String(c||"").split(/```(\w*)\n?([\s\S]*?)\n?```/).map((t,i,a) => i % 3 === 1 ? "" : i % 3 === 2
  ? `<pre><code${a[i-1] ? ` class="language-${a[i-1] === "js" ? "javascript" : a[i-1]}"` : ""}>${esc(t)}</code></pre>`
  : t.split(/\n+/).filter(p=>p.trim()).map(p=>"<p>"+paraHtml(p)+"</p>").join("")).join("");
const testoCommento = v => v.commento ? disclaimer() + "\n\n" + v.commento.replace(/```\w*\n?/g, "").replace(/`/g, "") : "";
const htmlCommento = v => v.commento ? "<p><em>"+esc(disclaimer())+"</em></p>"+corpoHtml(v.commento) : "";
const anteprima = c => /`/.test(c||"") ? corpoHtml(c) : "";

// Resoconto per il docente: righe «Etichetta: testo», con l'etichetta in grassetto; il codice come nei commenti.
const resHtml = t => corpoHtml(t).replace(/<p>([A-ZÀ-Ý][^<:]{1,40}):/g, "<p><b>$1:</b>");
const oggiISO = () => new Date().toISOString().slice(0, 10);
function resocontoHtml(id, titolo, r, vuoto){
  const t = r?.testo || "";
  const quando = r?.aggiornato ? "Aggiornato il " + esc(String(r.aggiornato).slice(0,10).split("-").reverse().join("/")) + (r.modificato ? " · modificato da te" : "") : "";
  return `<section class="riquadro resoconto" aria-labelledby="t-${id}"><h3 id="t-${id}">${titolo} <span class="n">solo per te</span></h3>
    ${t ? `<div class="res-testo">${resHtml(t)}</div>` : `<p class="n">${vuoto}</p>`}
    <textarea class="in-res" id="rt-${id}" hidden>${esc(t)}</textarea>
    <div class="riga"><button class="btn" data-res="${id}">${t ? "Modifica" : "Scrivi"}</button><span class="n">${quando}</span><span class="salvato" id="rs-${id}"></span></div></section>`;
}
function collegaRes(id, salva){
  const b = document.querySelector(`[data-res="${id}"]`), ta = $("#rt-" + id); if (!b || !ta) return;
  b.onclick = async () => {
    if (ta.hidden) { ta.hidden = false; ta.style.minHeight = "240px"; ta.focus(); b.textContent = "Salva"; return; }
    b.disabled = true;
    try { await salva(ta.value); } catch(e){ $("#rs-" + id).textContent = "Non salvato: " + (e.code || "errore"); b.disabled = false; return; }
    ta.blur(); render();
  };
}
async function salvaResStud(k, testo){
  const ref = st.db.collection(`verifiche/${st.vid}/resoconti`).doc("studenti");
  const riga = {righe: {[k]: {testo, aggiornato: oggiISO(), modificato: true}}};
  try { await ref.update(riga); } catch(_) { await ref.set(riga); }
}

async function copia(testo, html){
  try {
    if (html && window.ClipboardItem && navigator.clipboard?.write) {
      await navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([html],{type:"text/html"}), "text/plain": new Blob([testo],{type:"text/plain"})})]);
    } else { await navigator.clipboard.writeText(testo); }
    toast("Copiato");
  } catch(e) {
    const ta=document.createElement("textarea"); ta.value=testo; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copiato"); }catch(_){ toast("Copia non riuscita: seleziona il testo a mano"); }
    ta.remove();
  }
}

const pending = {};
function scrivi(id, campi){
  Object.assign(st.val[id], campi);
  const vid = st.vid;
  clearTimeout(pending[id]?.t);
  pending[id] = { t: setTimeout(async () => {
    const p = pending[id]; delete pending[id];
    if (!st.db) return;
    const [docId, chiave] = id.split("__");
    try { await st.db.collection(`verifiche/${vid}/valutazioni`).doc(docId).update({righe: {[chiave]: p.campi}}); segnaSalvato(id, "Salvato"); }
    catch(e){ segnaSalvato(id, "Non salvato: " + (e.code||"errore")); }
  }, 600), campi: Object.assign(pending[id]?.campi || {}, campi) };
  segnaSalvato(id, "…");
}
function segnaSalvato(id, t){ const el=document.querySelector(`[data-salv="${id}"]`); if(el) el.textContent=t; }

/* ---------- elenco delle verifiche ---------- */
function renderElenco(){
  $("#indietro").hidden = true; $("#comandi").hidden = true; $("#tabs").hidden = true;
  $("#titolo").textContent = "Correzione verifiche";
  $("#sottotitolo").textContent = "Le verifiche da correggere, con le proposte di punteggio e commento da riportare in Moodle.";
  const tutte = Object.values(st.verifiche).sort((a,b)=>String(b.creato||"").localeCompare(String(a.creato||"")));
  const attive = tutte.filter(v=>!v.archiviata), arch = tutte.filter(v=>v.archiviata);
  $("#stato").textContent = attive.length ? (attive.length === 1 ? "1 verifica in corso" : `${attive.length} verifiche in corso`) : "";
  const card = v => {
    const p = v.avanzamento || {}; const fatte = p.fatte != null ? p.fatte : (p.riviste||0); const perc = p.righe ? Math.round(fatte/p.righe*100) : 0;
    const testo = !p.righe ? "da aprire" : p.ins != null ? (p.ins ? `Moodle: ${p.insF||0}/${p.ins} inserite` : "nulla da inserire in Moodle") : `${fatte}/${p.righe} righe`;
    return `<button class="verifica" data-vid="${esc(v.id)}"><div><h3>${esc(v.titolo||v.id)}</h3><span class="n">${esc(v.sottotitolo||"")}${v.studenti?` · ${v.studenti} studenti`:""}${v.creato?` · ${esc(String(v.creato).split("-").reverse().join("/"))}`:""}</span></div>
      <div><div class="barra" aria-hidden="true"><i style="width:${perc}%"></i></div><span class="n">${testo}</span></div></button>`;
  };
  let h = `<p class="riga" style="margin-bottom:12px"><button class="btn pieno" id="nuova">Nuova correzione</button><span class="n">dall'Excel delle risposte di Moodle, anche con i nomi: li toglie la pagina, nel tuo browser</span></p>`;
  h += attive.length ? `<div class="elenco">${attive.map(card).join("")}</div>`
    : `<div class="vuoto">Nessuna verifica da correggere. In chat: «correggi questa verifica», con l'export «Risposte» di Moodle anonimizzato.</div>`;
  if (tutte.length) h += `<p class="leg">Per archiviare o eliminare una verifica: aprila e vai in «Riepilogo voti».</p>`;
  if (arch.length) h += `<details class="archivio"><summary>Archiviate (${arch.length})</summary><div class="elenco" style="margin-top:10px">${arch.map(card).join("")}</div></details>`;
  $("#vista").innerHTML = h;
  $("#nuova").onclick = () => { st.nuova = true; nuova.reset(); render(); };
  document.querySelectorAll("[data-vid]").forEach(b => b.onclick = () => apri(b.dataset.vid));
}

/* ---------- una verifica ---------- */
function apri(vid){
  st.unsub.forEach(u => { try{u();}catch(_){} }); st.unsub = [];
  st.vid = vid; st.domande = {}; st.val = {}; st.res = {}; st.resClasse = null; st.tab = null; st.stud = null; salvaUI();
  if (!vid) { render(); return; }
  $("#vista").innerHTML = `<div class="vuoto">Caricamento delle correzioni…</div>`;
  const base = `verifiche/${vid}`;
  st.unsub.push(st.db.collection(base + "/domande").limit(200).onSnapshot(s => {
    st.domande = {}; s.docs.forEach(d => st.domande[d.id] = {id:d.id, ...d.data()}); render();
  }, e => { $("#stato").textContent = "Errore nel leggere le domande: " + e.code; }));
  // Resoconti per il docente: documento «studenti» (righe: chiave → {testo, aggiornato, modificato}) e documento «classe»
  st.unsub.push(st.db.collection(base + "/resoconti").limit(10).onSnapshot(s => {
    st.res = {}; st.resClasse = null;
    s.docs.forEach(d => { if (d.id === "studenti") st.res = d.data().righe || {}; if (d.id === "classe") st.resClasse = d.data(); });
    if (document.activeElement?.classList.contains("in-res")) return;
    if (st.vista === "studente" || st.vista === "riep") render();
  }, () => {}));
  st.unsub.push(st.db.collection(base + "/valutazioni").limit(200).onSnapshot(s => {
    const attivo = document.activeElement; const focusId = attivo?.id; const sel = attivo && "selectionStart" in attivo ? [attivo.selectionStart, attivo.selectionEnd] : null;
    s.docChanges().forEach(ch => {
      const dId = ch.doc.id;
      Object.keys(st.val).forEach(k => { if (k.startsWith(dId + "__")) delete st.val[k]; });
      if (ch.type === "removed") return;
      for (const [chiave, riga] of Object.entries(ch.doc.data().righe || {})) {
        const id = dId + "__" + chiave;
        const nuovo = {id, d: dId, k: chiave, ...riga};
        if (pending[id]) Object.assign(nuovo, pending[id].campi);
        st.val[id] = nuovo;
      }
    });
    const cambiFuori = s.docChanges().some(ch => !ch.doc.metadata.hasPendingWrites);
    if (cambiFuori || !focusId) { render(); if (focusId) { const el=document.getElementById(focusId); if (el){ el.focus(); if (sel && "setSelectionRange" in el) try{ el.setSelectionRange(sel[0], sel[1]); }catch(_){} } } }
    else { renderStato(); }
  }, e => { $("#stato").textContent = "Errore nel leggere le correzioni: " + e.code; }));
}

function renderStato(){
  if (!st.vid) return;
  const tutte = Object.values(st.val);
  const fatte = tutte.filter(aPosto).length, senza = tutte.filter(v=>v.punti==null).length;
  const ins = tutte.filter(v=>daMoodle(v)).length, insF = tutte.filter(v=>daMoodle(v)&&v.inserito).length;
  $("#stato").textContent = tutte.length ? `Moodle: ${insF}/${ins} inserite${senza?` · ${senza} senza punteggio`:""}` : "";
  segnaAvanzamento({righe: tutte.length, fatte, ins, insF});
}
let ultimoAv = "";
function segnaAvanzamento(av){                  // l'avanzamento nell'elenco, scritto solo quando cambia
  const k = `${st.vid}:${av.righe}:${av.fatte}:${av.ins}:${av.insF}`; if (k === ultimoAv || !av.righe) return; ultimoAv = k;
  const a = info().avanzamento; if (a && a.righe === av.righe && a.fatte === av.fatte && a.ins === av.ins && a.insF === av.insF) return;
  clearTimeout(segnaAvanzamento.t);
  const vid = st.vid;
  segnaAvanzamento.t = setTimeout(() => st.db?.doc(`verifiche/${vid}`).update({avanzamento: av}).catch(()=>{}), 1500);
}

function renderTabs(){
  const t = $("#tabs");
  if (st.vista === "riep" || st.vista === "importa") { t.hidden = true; return; }
  t.hidden = false;
  if (st.vista === "domanda") {
    t.innerHTML = domOrd().map(d => {
      const r = righe(d.id); const fatte = r.filter(aPosto).length;
      const ins = r.filter(v=>daMoodle(v) && !v.inserito).length, senza = r.filter(v=>v.punti==null).length;
      return `<button role="tab" data-tab="${d.id}" aria-selected="${st.tab===d.id}" class="${fatte===r.length&&r.length?'fatta':''}">
        <span>D${d.n} · ${esc(d.breve)}</span><small>${ins?`${ins} da inserire`:(senza?`${senza} senza punteggio`:(r.length?'a posto':''))}</small></button>`;
    }).join("");
    t.querySelectorAll("button").forEach(b => b.onclick = () => { st.tab = b.dataset.tab; render(); window.scrollTo({top:0}); });
  } else {
    const M = massimo();
    t.innerHTML = studenti().map(s => {
      const {tot, manca} = totale(s.k);
      const r = domOrd().map(d=>rigaDi(d.id, s.k)).filter(Boolean); const fatte = r.filter(aPosto).length, ins = r.filter(v=>daMoodle(v) && !v.inserito).length;
      return `<button role="tab" class="sigla-tab ${fatte===r.length&&r.length?'fatta':''}" data-stud="${esc(s.k)}" aria-selected="${st.stud===s.k}">
        <span>${esc(s.s)}</span><small>${fmt(tot/M*10)}${manca?'*':''}${ins?` · ${ins} da inserire`:''}</small></button>`;
    }).join("");
    t.querySelectorAll("button").forEach(b => b.onclick = () => { st.stud = b.dataset.stud; render(); window.scrollTo({top:0}); });
  }
}

function cardHtml(v, dom, modo){
  const m = daMoodle(v);
  const chip = v.esito ? `<span class="chip ${v.esito.startsWith('OK')?'ok':(/^(vuota|in attesa)/.test(v.esito)?'muted':'bad')}">${esc(v.esito)}</span>` : "";
  const autoTxt = dom.tipo === "auto" ? `Automatico in Moodle (stimato rieseguendo i test): ${fmt(v.auto)}` : "";
  const perc = (v.punti!=null && dom.max) ? Math.round(v.punti/dom.max*100)+"%" : "";
  const testa = modo === "domanda"
    ? `<span class="sigla">${esc(v.s)}</span><span class="n">${posiz(v.ord)} di ${nStud()}</span>`
    : `<span class="dom-tit">D${dom.n} · ${esc(dom.breve)} · ${esc(dom.titolo)}</span><span class="n">max ${fmt(dom.max)}</span>`;
  return `<article class="card ${v.inserito?'inserito':(m?'da-moodle':'')}">
    <div class="chi">${testa}${chip}
      ${m && !v.inserito ? `<span class="chip warn">${dom.tipo==='manuale'?'da inserire':(cambiaPunti(v)?'da modificare':'commento da inserire')}</span>`:''}</div>
    ${st.nascondiRisp ? '' : `<pre class="risp">${esc(v.risposta || "(nessuna risposta)")}</pre>`}
    <div class="voto">
      <div class="riga">
        <label class="punti" for="p-${v.id}"><input id="p-${v.id}" type="number" inputmode="decimal" min="0" max="${dom.max}" step="0.5" value="${v.punti ?? ''}" data-id="${v.id}" data-max="${dom.max}" class="in-punti" placeholder="—"><span>/ ${fmt(dom.max)}</span></label>
        <span class="perc">${perc}</span>
        <button class="btn" data-copia-p="${v.id}" ${v.punti==null?'disabled':''}>Copia punteggio</button>
      </div>
      ${autoTxt ? `<div class="nota-moodle">${autoTxt}${!m?' · nessuna modifica':(cambiaPunti(v)?` → <b>porta a ${fmt(v.punti)}</b>`:' · punteggio invariato, <b>inserisci il commento</b>')}</div>`:''}
      <textarea id="c-${v.id}" data-id="${v.id}" class="in-comm" placeholder="Nessun commento (punteggio pieno)">${esc(v.commento)}</textarea>
      <div class="anteprima" id="a-${v.id}" title="Come appare in Moodle: il codice tra apici inversi diventa codice">${anteprima(v.commento)}</div>
      <div class="riga">
        <button class="btn pieno" data-copia-c="${v.id}" ${v.commento?'':'disabled'}>Copia commento per Moodle</button>
        <span class="salvato" data-salv="${v.id}"></span>
      </div>
      <div class="spunte">
        ${m || v.inserito ? `<label><input type="checkbox" data-ins="${v.id}" ${v.inserito?'checked':''}> Inserito in Moodle</label>`:''}
      </div>
    </div></article>`;
}

function filtriHtml(){
  return `<div class="filtri">
    <label><input type="checkbox" id="f-moodle" ${st.soloMoodle?'checked':''}> Solo le righe ancora da inserire in Moodle</label>
    <label><input type="checkbox" id="f-risp" ${st.nascondiRisp?'checked':''}> Nascondi le risposte</label></div>`;
}

function collega(){
  $("#f-moodle")?.addEventListener("change", e => { st.soloMoodle = e.target.checked; salvaUI(); render(); });
  $("#f-risp")?.addEventListener("change", e => { st.nascondiRisp = e.target.checked; salvaUI(); render(); });
  document.querySelectorAll(".in-punti").forEach(i => i.oninput = () => {
    const raw = i.value.replace(",", "."); const n = raw === "" ? null : Number(raw); const max = Number(i.dataset.max);
    if (n != null && (isNaN(n) || n < 0 || n > max)) { i.setCustomValidity("Tra 0 e " + max); i.reportValidity(); return; }
    i.setCustomValidity(""); scrivi(i.dataset.id, {punti:n}); renderStato(); renderTabs(); aggiornaTotStud();
  });
  document.querySelectorAll(".in-comm").forEach(t => t.oninput = () => {
    scrivi(t.dataset.id, {commento:t.value});
    const a = document.getElementById("a-" + t.dataset.id); if (a) a.innerHTML = anteprima(t.value);
    const b = document.querySelector(`[data-copia-c="${t.dataset.id}"]`); if (b) b.disabled = !t.value;
  });
  document.querySelectorAll("[data-copia-c]").forEach(b => b.onclick = () => { const v = st.val[b.dataset.copiaC]; copia(testoCommento(v), htmlCommento(v)); });
  document.querySelectorAll("[data-copia-p]").forEach(b => b.onclick = () => { const v = st.val[b.dataset.copiaP]; copia(fmt(v.punti)); });
  document.querySelectorAll("[data-ins]").forEach(c => c.onchange = () => { scrivi(c.dataset.ins, {inserito:c.checked}); render(); });
}

function renderDomanda(d){
  const dom = st.domande[d]; const r = righe(d);
  const vis = st.soloMoodle ? r.filter(v => daMoodle(v) && !v.inserito) : r;
  const azione = dom.tipo === "manuale"
    ? "In Moodle: punteggio e commento per tutti."
    : "In Moodle: solo le righe segnate «da modificare» (il punteggio automatico è diverso dalla proposta) o «commento da inserire» (stesso punteggio, con un commento per lo studente).";
  let h = `<section class="intesta"><h2>D${dom.n} · ${esc(dom.titolo)} <span class="n">max ${fmt(dom.max)} punti</span></h2>
    <div class="criteri">${esc(dom.criteri)}${dom.criteri?"\n":""}${azione}</div>${filtriHtml()}</section><div class="lista">`;
  if (!vis.length) h += `<div class="vuoto">${r.length ? "Niente da inserire in Moodle per questa domanda." : "Nessuna riga per questa domanda."}</div>`;
  h += vis.map(v => cardHtml(v, dom, "domanda")).join("") + `</div>`;
  $("#vista").innerHTML = h; collega();
}

function totStudHtml(k){
  const {tot, manca} = totale(k); const M = massimo();
  return `<span>Totale <b>${fmt(tot)}</b> / ${fmt(M)}${manca?'*':''}</span><span>Voto <span class="voto10">${fmt(tot/M*10)}${manca?'*':''}</span></span>${manca?'<span class="n">* provvisorio: manca almeno un punteggio</span>':''}`;
}
function aggiornaTotStud(){ const el = $("#tot-stud"); if (el && st.stud) el.innerHTML = totStudHtml(st.stud); }

function renderStudente(k){
  const s = studenti().find(x => x.k === k); if (!s) return;
  const lista = domOrd().map(d => [rigaDi(d.id, k), d]).filter(([v]) => v);
  const vis = st.soloMoodle ? lista.filter(([v]) => daMoodle(v) && !v.inserito) : lista;
  let h = `<section class="intesta"><h2><span class="sigla">${esc(s.s)}</span> <span class="n">${posiz(s.ord)} di ${nStud()}</span></h2>
    <div class="totale-stud" id="tot-stud">${totStudHtml(k)}</div>
    ${resocontoHtml("stud", "Resoconto", st.res[k], "Nessun resoconto per questo studente: chiedi a Claude di preparare i resoconti della verifica.")}
    <div class="criteri">Tutte le domande di questo studente. Utile per controllare il voto complessivo, o per inserire in Moodle dalla revisione del tentativo («Commenta o modifica la valutazione»).</div>${filtriHtml()}</section><div class="lista">`;
  if (!vis.length) h += `<div class="vuoto">Niente da inserire in Moodle per questo studente.</div>`;
  h += vis.map(([v, d]) => cardHtml(v, d, "studente")).join("") + `</div>`;
  $("#vista").innerHTML = h; collega();
  collegaRes("stud", testo => salvaResStud(k, testo));
}

// Istogramma dei voti a fasce di mezzo voto (0–0,5 … 9,5–10; il 10 va nell'ultima), con la linea della sufficienza.
function istogrammaHtml(voti, provv){
  if (!voti.length) return "";
  const n = 20, cnt = Array(n).fill(0);
  voti.forEach(v => { cnt[Math.max(0, Math.min(n - 1, Math.floor(v * 2 + 1e-9)))]++; });
  const W = 640, H = 220, ml = 30, mr = 6, mt = 18, mb = 30, pw = W - ml - mr, ph = H - mt - mb, bw = pw / n;
  const top = Math.max(1, ...cnt), passo = top <= 6 ? 1 : Math.ceil(top / 5), yMax = Math.ceil(top / passo) * passo;
  const y = c => mt + ph - c / yMax * ph, f = x => fmt(x);
  let s = "";
  for (let t = 0; t <= yMax; t += passo) s += `<line class="griglia" x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}"/><text class="asse" x="${ml - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  for (let k = 0; k <= 10; k++) s += `<text class="asse" x="${ml + k * 2 * bw}" y="${H - mb + 16}" text-anchor="middle">${k}</text>`;
  cnt.forEach((c, i) => {
    const x = ml + i * bw + 1, w = bw - 2, da = f(i / 2), a = f((i + 1) / 2);
    const tip = `${da}–${a}: ${c} ${c === 1 ? "studente" : "studenti"}`;
    let p = "";
    if (c) { const yt = y(c), r = Math.min(4, w / 2, (mt + ph - yt) / 2), yb = mt + ph;
      p = `<path d="M${x},${yb} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + w - r} Q${x + w},${yt} ${x + w},${yt + r} V${yb} Z"/><text class="val" x="${x + w / 2}" y="${yt - 5}">${c}</text>`; }
    s += `<g class="barra"><title>${tip}</title><rect x="${x - 1}" y="${mt}" width="${bw}" height="${ph}"/>${p}</g>`;
  });
  const xs = ml + 12 * bw;
  s += `<line class="soglia" x1="${xs}" x2="${xs}" y1="${mt - 6}" y2="${mt + ph}"/><text class="asse" x="${xs + 5}" y="${mt - 2}">sufficienza</text>`;
  s += `<line class="griglia" x1="${ml}" x2="${W - mr}" y1="${mt + ph}" y2="${mt + ph}" style="stroke:var(--muted)"/>`;
  const ord = [...voti].sort((a, b) => a - b), med = ord.length % 2 ? ord[(ord.length - 1) / 2] : (ord[ord.length / 2 - 1] + ord[ord.length / 2]) / 2;
  const media = voti.reduce((a, b) => a + b, 0) / voti.length, suff = voti.filter(v => v >= 6 - 1e-9).length;
  const riass = `${voti.length} studenti · media ${f(media)} · mediana ${f(med)} · sufficienti ${suff} su ${voti.length}${provv ? " · provvisorio" : ""}`;
  return `<section class="isto" aria-labelledby="t-isto"><h3 id="t-isto">Distribuzione dei voti</h3><span class="n">A fasce di mezzo voto, con i punteggi di questa pagina. ${riass}.</span>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Istogramma dei voti a fasce di mezzo voto: ${riass}">${s}</svg></section>`;
}

function renderRiep(){
  const doms = domOrd(); const M = massimo();
  let h = `<section class="intesta"><h2>Riepilogo dei punteggi</h2>
    <div class="criteri">Totale su ${fmt(M)} e voto su 10 con i punteggi proposti o modificati qui. Una domanda ancora senza punteggio conta 0 e il totale è segnato come provvisorio. Clic su una riga per aprire lo studente.</div></section>
    <div class="tab-wrap"><table class="riep"><thead><tr><th>Studente</th>${doms.map(d=>`<th title="${esc(d.titolo)}">D${d.n}<br><span class="n">${fmt(d.max)}</span></th>`).join("")}<th>Totale</th><th>Voto</th></tr></thead><tbody>`;
  let somma = 0; const st_ = studenti();
  for (const s of st_){
    const {tot, manca} = totale(s.k); somma += tot;
    const celle = doms.map(d => { const v = rigaDi(d.id, s.k); return (!v || v.punti==null) ? `<td class="attesa">—</td>` : `<td>${fmt(v.punti)}</td>`; }).join("");
    h += `<tr data-apri="${esc(s.k)}"><td>${esc(s.s)}</td>${celle}<td class="tot">${fmt(tot)}${manca?'*':''}</td><td class="voto10">${fmt(tot/M*10)}${manca?'*':''}</td></tr>`;
  }
  h += `</tbody></table></div><p class="leg">* provvisorio: manca almeno un punteggio. Media della classe: ${fmt(st_.length ? somma/st_.length/M*10 : 0)} su 10.</p>`;
  h += istogrammaHtml(st_.map(s => totale(s.k).tot / M * 10), st_.some(s => totale(s.k).manca));
  h += resocontoHtml("classe", "Resoconto della classe", st.resClasse, "Nessun resoconto della classe: chiedi a Claude di preparare i resoconti della verifica.");
  const arch = !!info().archiviata;
  h += `<section class="riquadro" aria-labelledby="t-archivia"><h3 id="t-archivia">Archivia o elimina la verifica</h3>
    <p class="n">Archiviata, la verifica resta consultabile in fondo all'elenco. Eliminata, si perdono punteggi e commenti: prima di eliminarla, se ti serve una copia, chiedi a Claude la tabella dei voti.</p>
    <div class="riga"><button class="btn" id="archivia">${arch ? "Riporta tra le verifiche in corso" : "Archivia la verifica"}</button>
      <button class="btn pericolo" id="elimina">Elimina…</button></div>
    <div class="conferma" id="conferma" hidden><p>Eliminare definitivamente <b>${esc(info().titolo || st.vid)}</b>, con tutti i punteggi e i commenti? Non si può annullare.</p>
      <div class="riga"><button class="btn pericolo pieno" id="elimina-ok">Elimina definitivamente</button><button class="btn" id="elimina-no">Annulla</button></div></div></section>`;
  $("#vista").innerHTML = h;
  collegaRes("classe", testo => st.db.collection(`verifiche/${st.vid}/resoconti`).doc("classe").set({testo, aggiornato: oggiISO(), modificato: true}));
  $("#archivia").onclick = async () => { const vid = st.vid; try { await st.db.doc(`verifiche/${vid}`).update({archiviata: !arch}); toast(arch ? "Riportata tra quelle in corso" : "Archiviata"); if (!arch) apri(null); } catch(e){ toast("Non riuscito: " + (e.code||"errore")); } };
  $("#elimina").onclick = () => { $("#conferma").hidden = false; $("#elimina-ok").focus(); };
  $("#elimina-no").onclick = () => { $("#conferma").hidden = true; };
  $("#elimina-ok").onclick = async () => {
    const vid = st.vid; const b = $("#elimina-ok"); b.disabled = true; b.textContent = "Eliminazione…";
    const ids = new Set([...Object.keys(st.domande), ...Object.values(st.val).map(v => v.d)]);
    try {
      for (const d of ids) {                    // i documenti annidati non si cancellano da soli
        await st.db.collection(`verifiche/${vid}/valutazioni`).doc(d).delete();
        await st.db.collection(`verifiche/${vid}/domande`).doc(d).delete();
      }
      await st.db.doc(`verifiche/${vid}`).delete();
      toast("Verifica eliminata"); apri(null);

/* La tabella copiata dal browser ha i tag ma comprime spazi e a capo; l'export ha a capo e rientri

   ogni spazio di I corrisponde a un tratto di spazi dell'originale. */

  while (i < I.length) {
    const c = I[i];
    const tolto = c === "<" && tagA(I, i) && !(j < E.length && E[j] === "<");
    if (!(sp(c) || tolto || (j < E.length && sp(E[j])))) { out.push(c); i++; if (j < E.length && E[j] === c) j++; continue; }
    const token = [];
    while (i < I.length) {

      else if (I[i] === "<" && tagA(I, i) && !(j < E.length && E[j] === "<" && !token.length)) { const t = tagA(I, i); token.push(t); i += t.length; }
      else break;
    }
    let k = j; while (k < E.length && sp(E[k])) k++;

    const n = token.filter(t => t === null).length;
    const pezzi = run.split(/(?=\n)/).filter(Boolean);
    if (!n) { out.push(token.join("") + run); continue; }
    let parti;
    if (!pezzi.length) parti = Array(n).fill(j >= E.length ? "\n" : " ");
    else if (pezzi.length >= n) parti = [pezzi.slice(0, pezzi.length - n + 1).join("")].concat(pezzi.slice(pezzi.length - n + 1));
    else parti = Array(n - pezzi.length).fill(" ").concat(pezzi);

/* ---------- Nuova correzione: l'Excel di Moodle letto e ripulito nel browser ----------
   Un .xlsx è uno zip di file XML: lo apriamo qui (DecompressionStream del browser), senza

async function apriZip(buf){

  if (n.studenti) {
    h += `<div class="riquadro"><h3>2 · La tabella copiata dal browser (facoltativa)</h3>
      <div class="incolla" id="incolla-n" tabindex="0" role="textbox" aria-label="Incolla qui la tabella delle risposte">${n.tabella ? `Tabella letta: ${n.tabella.lette} tentativi, ${n.tabella.abbinate} abbinati, ${n.tabella.recuperate} risposte aggiornate dalla tabella (quelle con i tag che l'Excel aveva tolto). Incolla di nuovo per sostituirla.` : "Fai clic qui e incolla la tabella (Ctrl+V)"}</div>
      ${n.tabErr ? `<p class="leg" style="color:var(--bad)">${esc(n.tabErr)}</p>` : ""}
      ${n.tabella && n.tabella.abbinate < n.tabella.lette ? `<p class="leg" style="color:var(--warn)">${n.tabella.lette - n.tabella.abbinate} tentativi della tabella non hanno un nome uguale nell'Excel: restano le risposte dell'Excel.</p>` : ""}</div>
    <div class="riquadro"><h3>3 · Anteprima e salvataggio</h3>
      <div class="riga"><label for="n-tit">Titolo</label><input id="n-tit" class="campo" value="${esc(n.titolo)}" placeholder="V5R · 5Q SIA" style="flex:1;min-width:12em;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)"></div>
      <div class="riga"><label for="n-sot">Verifica</label><input id="n-sot" class="campo" value="${esc(n.sottotitolo)}" placeholder="Verifica di ripasso SQL e PHP" style="flex:1;min-width:12em;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)"></div>
      <p class="n">Sigle, in ordine di cognome come nel file: ${n.studenti.map(s => `<span class="sigla">${esc(s.s)}</span>`).join(" ")}</p>
      <p class="n">Domande: ${n.domande.map(d => `D${d.n}${d.testi.length > 1 ? ` (${d.testi.length} varianti)` : ""}`).join(" · ")}. Risposte con tag HTML: ${n.studenti.reduce((a, s) => a + Object.values(s.risposte).filter(t => /<[a-z!?]/i.test(t)).length, 0)}.</p>
      <div class="riga"><button class="btn pieno" id="n-salva" ${n.salvo?'disabled':''}>${n.salvo ? "Salvataggio…" : "Salva e apri la verifica"}</button><button class="btn" id="n-annulla">Annulla</button></div></div>`;
  }
  $("#vista").innerHTML = h;
  const inp = $("#file-xlsx"), zona = $("#file-zona");
  const carica = async f => { if (!f) return; try {
      const righe = /\.csv$/i.test(f.name) ? leggiCsv(await f.text()) : await leggiXlsx(await f.arrayBuffer());
      const r = preparaDaTabella(righe); Object.assign(nuova, r, {errore: null, tabella: null, tabErr: null});
    } catch (e) { nuova.studenti = null; nuova.errore = "Non riesco a leggere il file: " + (e.message || e); }
    renderNuova(); };
  inp.onchange = () => carica(inp.files[0]);
  zona.addEventListener("dragover", e => { e.preventDefault(); });
  zona.addEventListener("drop", e => { e.preventDefault(); carica(e.dataTransfer.files[0]); });
  $("#incolla-n")?.addEventListener("paste", e => { e.preventDefault();
    const html = e.clipboardData?.getData("text/html") || "";
    nuova.tabErr = html ? uniscitabella(html) : "Negli appunti c'è solo testo: copia la tabella dalla pagina di Moodle nel browser."; renderNuova(); });
  $("#n-tit")?.addEventListener("input", e => { nuova.titolo = e.target.value; });
  $("#n-sot")?.addEventListener("input", e => { nuova.sottotitolo = e.target.value; });
  $("#n-annulla")?.addEventListener("click", () => { st.nuova = false; nuova.reset(); render(); });
  $("#n-salva")?.addEventListener("click", async () => {
    if (!nuova.titolo.trim()) { toast("Scrivi un titolo, per esempio «V5R · 5Q SIA»"); $("#n-tit").focus(); return; }
    let vid = nuova.titolo.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "verifica";
    while (st.verifiche[vid]) vid += "-2";
    nuova.salvo = true; renderNuova();
    try {
      const base = `verifiche/${vid}`, oggi = new Date().toISOString().slice(0, 10);
      const doc = {titolo: nuova.titolo.trim(), sottotitolo: nuova.sottotitolo.trim(), studenti: nuova.studenti.length,
        creato: oggi, archiviata: false, origine: "dashboard", stato: "da correggere", avanzamento: {righe: 0, fatte: 0, ins: 0, insF: 0}};
      await st.db.doc(base).set(doc); st.verifiche[vid] = {id: vid, ...doc};
      for (const d of nuova.domande) {
        const id = "D" + String(d.n).padStart(2, "0"); const righe = {};
        nuova.studenti.forEach((s, i) => { righe[s.k] = {s: s.s, ord: i, risposta: s.risposte[d.n] || "", esito: "in attesa", auto: null,
          punti: null, commento: "", inserito: false, ...(d.testi.length > 1 ? {variante: d.testi.indexOf(s.testi[d.n])} : {})}; });
        await st.db.collection(base + "/domande").doc(id).set({n: d.n, breve: "D" + d.n, titolo: (d.testi[0] || "").replace(/\s+/g, " ").slice(0, 70),
          max: null, tipo: "manuale", criteri: "In attesa delle proposte di Claude.", testi: d.testi});
        await st.db.collection(base + "/valutazioni").doc(id).set({righe});
      }
      toast("Verifica salvata"); st.nuova = false; nuova.reset(); apri(vid);
    } catch (e) { nuova.salvo = false; renderNuova(); toast("Salvataggio non riuscito: " + (e.code || e.message || "errore")); }
  });
}

function render(){
  if (!st.db) return;
  if (st.nuova) { renderNuova(); return; }
  if (!st.vid || !st.verifiche[st.vid]) { if (st.vid && Object.keys(st.verifiche).length && !st.verifiche[st.vid]) st.vid = null; renderElenco(); return; }
  const v = info();
  $("#indietro").hidden = false; $("#comandi").hidden = false;
  $("#ordine").textContent = st.ordine === 1 ? "A → Z" : "Z → A";
  $("#titolo").textContent = v.titolo || st.vid;
  $("#sottotitolo").textContent = (v.sottotitolo ? v.sottotitolo + " · " : "") + "ordine di cognome, come in Valutazione manuale";
  document.querySelectorAll("#viste button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.vista === st.vista)));
  if (!Object.keys(st.domande).length) { $("#tabs").hidden = true; return; }
  if (!st.tab || !st.domande[st.tab]) st.tab = domOrd()[0].id;
  const ss = studenti(); if (ss.length && (!st.stud || !ss.find(x=>x.k===st.stud))) st.stud = ss[0].k;
  renderTabs(); renderStato();
  if (st.vista === "riep") renderRiep();
  else if (st.vista === "importa") renderImporta();
  else if (st.vista === "studente") { if (st.stud) renderStudente(st.stud); }
  else renderDomanda(st.tab);
}

$("#indietro").onclick = () => { st.nuova = false; nuova.reset(); apri(null); };
$("#ordine").onclick = () => { st.ordine = -st.ordine; salvaUI(); render(); };
document.querySelectorAll("#viste button").forEach(b => b.onclick = () => { st.vista = b.dataset.vista; salvaUI(); render(); window.scrollTo({top:0}); });

(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) { $("#vista").innerHTML = `<div class="vuoto">Il database delle correzioni non è disponibile in questa vista. Apri la pagina da claude.ai con il tuo account.</div>`; $("#stato").textContent=""; return; }
  st.db = db;
  let primo = true;
  db.collection("verifiche").limit(500).onSnapshot(s => {
    st.verifiche = {}; s.docs.forEach(d => st.verifiche[d.id] = {id:d.id, ...d.data()});
    if (primo) { primo = false; if (st.vid && st.verifiche[st.vid]) { apri(st.vid); return; } st.vid = null; }
    if (st.nuova) return;
    if (!st.vid) renderElenco(); else { $("#titolo").textContent = info().titolo || st.vid; }
  }, e => { $("#stato").textContent = "Errore nel leggere le verifiche: " + e.code; });
})();
</script>
